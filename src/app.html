<!DOCTYPE html>
<html lang="ja">

<style>
:root{
  --pri:#ffb300;--pri-d:#d98a00;--pri-l:#fff3d2;--pri-t:#9a5a00;--pri-ink:#3d2600;
  --ok:#21c16b;--ok-d:#159a52;--ok-l:#dcfbe9;
  --ng:#ff4d5e;--ng-d:#d93041;--ng-l:#ffe3e6;
  --gold:#ffb21e;--gold-d:#e08f00;--fire:#ff7a1a;
  --sky:#1cb0f6;--sky-d:#1693cf;
  --ink:#1d1b33;--sub:#6b6987;--line:#e6e4f0;--bg:#f7f6fc;--card:#fff;
  --r:18px;--sh:0 2px 0 var(--line);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f1f0ff;--sub:#a8a6c6;--line:#2e2c48;--bg:#13121f;--card:#1c1b2e;--pri-l:#3a2c0c;--pri-t:#ffcf5a;--ok-l:#11351f;--ng-l:#3d1820}}
:root[data-theme=dark]{--ink:#f1f0ff;--sub:#a8a6c6;--line:#2e2c48;--bg:#13121f;--card:#1c1b2e;--pri-l:#3a2c0c;--pri-t:#ffcf5a;--ok-l:#11351f;--ng-l:#3d1820}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"LINE Seed JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.65;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
textarea,input,select{font-family:inherit;font-size:16px;color:var(--ink)}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
/* top bar */
.top{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top))!important;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:2px solid var(--line)}
.brand{font-weight:800;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.brand b{color:var(--pri-t)}
.stats{display:flex;gap:12px;font-weight:800;font-size:15px}
.stat{display:flex;align-items:center;gap:3px}
.stat.fire{color:var(--fire)}.stat.gem{color:var(--sky)}.stat.heart{color:var(--ng)}
.stat.dim{filter:grayscale(1);opacity:.5}
main{flex:1;padding:16px 16px calc(96px + var(--safe-b))}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:30;background:var(--card);border-top:2px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;border-radius:14px;font-size:11px;font-weight:700;color:var(--sub);border:2px solid transparent}
.nav button .ic{font-size:24px;line-height:1.2}
.nav button.on{color:var(--pri-t);background:var(--pri-l);border-color:color-mix(in srgb,var(--pri) 35%,transparent)}
/* cards & buttons */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 3px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:.04em;background:var(--pri);color:var(--pri-ink);box-shadow:0 4px 0 var(--pri-d);transition:transform .06s,box-shadow .06s,filter .2s;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--pri-d)}
.btn.ok,.btn.ng,.btn.sky{color:#fff}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.ng{background:var(--ng);box-shadow:0 4px 0 var(--ng-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#4a2e00}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
.btn.ghost{background:var(--card);color:var(--pri-t);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:12px}
.btn[disabled]{background:var(--line);color:var(--sub);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 70%,#000 8%);pointer-events:none}
h2{font-size:20px;margin:22px 0 10px;font-weight:800}
h3{font-size:17px;margin:0 0 6px;font-weight:800}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;background:var(--pri-l);color:var(--pri-t)}
.pill.gold{background:#fff3d6;color:#9a6400}.pill.ok{background:var(--ok-l);color:var(--ok-d)}.pill.ng{background:var(--ng-l);color:var(--ng-d)}
@media (prefers-color-scheme:dark){.pill.gold{background:#3a2c0c;color:#ffcf6b}}
/* hero */
.hero{display:flex;gap:14px;align-items:center}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none;transition:--p 1s}
.ring>div{color:var(--ink);width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px;line-height:1.1;text-align:center}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;text-align:left;font-weight:800;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .06s,box-shadow .06s;position:relative;overflow:hidden}
.qa:active{transform:translateY(4px);box-shadow:none}
.qa .e{font-size:26px}.qa small{font-weight:400;font-size:12px;opacity:.92}
.qa.a{background:linear-gradient(135deg,#ff8a3d,#ff5f6d)}.qa.b{background:linear-gradient(135deg,#7b61ff,#5b4cf5)}.qa.c{background:linear-gradient(135deg,#1cb0f6,#3b82f6)}.qa.d{background:linear-gradient(135deg,#22c55e,#0ea371)}
.qa .badge{position:absolute;top:8px;right:10px;background:#fff;color:var(--ng);font-size:11px;padding:0 7px;border-radius:99px}
/* path */
.unit{margin:26px 0 6px;border-radius:18px;padding:14px 16px;color:#fff;font-weight:800;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unit small{display:block;font-weight:400;font-size:12px;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:34px 0 8px}
.node{position:relative;width:72px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:28px;transition:transform .1s}
.node .disc{position:absolute;inset:0;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--cd)}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node .ico{position:relative;z-index:1;transition:transform .1s;color:#fff;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.node:active .ico{transform:translateY(5px)}
.node.todo .disc{background:var(--line);box-shadow:0 7px 0 color-mix(in srgb,var(--line) 70%,#000 12%)}
.node.todo .ico{filter:grayscale(1);opacity:.5}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--c);opacity:.35;animation:pulse 1.6s infinite}
.node .stars{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;z-index:2;letter-spacing:-1px}
.bubble{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--c);border:2px solid var(--line);font-weight:800;font-size:13px;padding:4px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;z-index:3}
.bubble::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
/* lesson */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 16px 6px}
.x{font-size:26px;color:var(--sub);width:32px;line-height:1}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok);transition:width .45s cubic-bezier(.3,1.4,.5,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.4)}
.bar.fire i{background:linear-gradient(90deg,#ffb21e,#ff5f1a,#ff2d55);background-size:200% 100%;animation:flow 1.2s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.lbody{flex:1;overflow:auto;padding:10px 16px 20px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.qtext{font-size:17px;font-weight:700;line-height:1.75;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:15px;line-height:1.6;transition:transform .06s,box-shadow .06s,border-color .15s,background .15s}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ch .k{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--sub)}
.ch.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--card));box-shadow:0 4px 0 var(--sky)}
.ch.sel .k{border-color:var(--sky);color:var(--sky)}
.ch.right{border-color:var(--ok);background:var(--ok-l);box-shadow:0 4px 0 var(--ok)}
.ch.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--ng);background:var(--ng-l);box-shadow:0 4px 0 var(--ng);animation:shake .4s}
.ch.wrong .k{background:var(--ng);border-color:var(--ng);color:#fff}
.ch.lock{pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.lfoot{padding:14px 16px calc(14px + var(--safe-b));border-top:2px solid var(--line);background:var(--bg);transition:background .2s}
.lfoot.ok{background:var(--ok-l);border-color:transparent}.lfoot.ng{background:var(--ng-l);border-color:transparent}
.verdict{display:none;margin-bottom:12px}
.lfoot.ok .verdict,.lfoot.ng .verdict{display:block;animation:up .25s ease-out}
.verdict .t{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.lfoot.ok .t{color:var(--ok-d)}.lfoot.ng .t{color:var(--ng-d)}
.verdict .ex{font-size:14px;margin-top:6px;max-height:34vh;overflow:auto;line-height:1.7}
@keyframes up{from{transform:translateY(16px);opacity:0}}
table.t{border-collapse:collapse;margin:12px 0;font-size:13px;width:100%;background:var(--card);border-radius:12px;overflow:hidden}
table.t td,table.t th{border:1.5px solid var(--line);padding:5px 7px;text-align:center}
table.t tr:first-child td{background:var(--pri-l);font-weight:800}
.combo{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:60;font-weight:800;font-size:22px;color:var(--fire);text-shadow:0 2px 0 #fff;pointer-events:none;animation:pop .9s forwards}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}25%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
.xpf{position:fixed;z-index:61;font-weight:800;color:var(--gold-d);pointer-events:none;animation:xpf 1s forwards;font-size:18px}
@keyframes xpf{to{transform:translateY(-60px);opacity:0}}
.timer{font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub);min-width:60px;text-align:right}
.timer.warn{color:var(--ng);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
/* overlay / modal */
.ov{position:fixed;inset:0;z-index:80;background:rgba(15,12,40,.5);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:24px;padding:24px 20px 20px;width:100%;max-width:400px;text-align:center;animation:zoom .35s cubic-bezier(.3,1.5,.5,1);max-height:88vh;overflow:auto}
@keyframes zoom{from{transform:scale(.7);opacity:0}}
.big{font-size:56px;line-height:1.1}
.rays{position:relative}
.rays::before{content:"";position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;background:repeating-conic-gradient(from 0deg,rgba(255,178,30,.25) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:90;animation:up .25s;max-width:90%}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:100;width:100%;height:100%}
/* results */
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:24px 16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border-radius:16px;border:2px solid var(--c);overflow:hidden;text-align:center;min-width:0}
.tile b{display:block;background:var(--c);color:#fff;font-size:12px;padding:3px}
.tile span{display:block;font-size:22px;font-weight:800;padding:10px 4px;color:var(--c);white-space:nowrap}
/* mascot */
.mascot{height:150px;width:auto;display:inline-block;object-fit:contain;-webkit-user-drag:none;user-select:none}
.mascot.s{height:84px;flex:none}
.mascot.logo{width:30px;height:30px;margin:-2px 0}
.mascot .wg{transform-origin:60px 44px;animation:flap .18s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.72)}}
.jump{animation:jump .6s ease-out}
@keyframes jump{30%{transform:translateY(-16px) scale(1.05,.95)}60%{transform:translateY(0) scale(.97,1.03)}}
.say{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;font-size:14px}
/* lists */
.li{display:flex;gap:12px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line);text-align:left;width:100%;margin-bottom:10px;transition:transform .06s,box-shadow .06s}
.li:active{transform:translateY(3px);box-shadow:none}
.li .e{font-size:26px;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--pri-l)}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:15px;line-height:1.45}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:99px;border:2px solid var(--line);font-weight:700;font-size:13px;background:var(--card)}
.chip.on{background:var(--pri);border-color:var(--pri-t);color:#fff}
/* writing */
.wa{width:100%;min-height:120px;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);resize:vertical;line-height:1.8;outline:none;transition:border-color .2s}
.wa:focus{border-color:var(--pri-t)}
.wa.tall{min-height:42vh}
.cnt{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-top:6px}
.gauge{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--ng);transition:width .2s,background .2s;border-radius:9px}
.gauge .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:9px 0;border-radius:12px;border:2px solid var(--line);font-weight:800;background:var(--card)}
.tabs button.on{border-color:var(--pri-t);color:var(--pri-t);background:var(--pri-l)}
.scen{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--pri);border-radius:14px;padding:14px;font-size:15px;line-height:1.85}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin-top:2px}
/* stats */
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat div{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat .l1{background:#ffe9a8}.heat .l2{background:#ffd04d}.heat .l3{background:#f5a300}.heat .l4{background:#b86e00}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg div{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:10.5px;font-weight:700;gap:4px;line-height:1.3}
.bdg .m{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#ffd76a,#ffa600);box-shadow:0 4px 0 #d48a00}
.bdg .off .m{background:var(--line);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 70%,#000 12%);filter:grayscale(1);opacity:.55}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;color:var(--sub);height:100%}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--pri);min-height:3px;transition:height .6s cubic-bezier(.3,1.4,.5,1)}
.bars .today i{background:var(--gold)}
.catbar{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0}
.catbar .n{width:132px;flex:none;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.catbar .b{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.catbar .b i{display:block;height:100%;border-radius:9px}
.foot{font-size:11px;color:var(--sub);line-height:1.7;margin-top:26px}
.foot a{color:var(--sub)}
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
@property --p{syntax:"<number>";inherits:false;initial-value:0}

<script>
"use strict";
/* ================= 基本 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KANA=["ア","イ","ウ","エ"];
const CATS=[
 {k:"int",n:"統合・標準",i:"🧭",c:"#5b4cf5",d:"#4234d6"},
 {k:"scope",n:"スコープ",i:"🎯",c:"#ff6b6b",d:"#d94848"},
 {k:"sched",n:"スケジュール",i:"📅",c:"#1cb0f6",d:"#1693cf"},
 {k:"cost",n:"コスト・見積り",i:"💰",c:"#ffb21e",d:"#e08f00"},
 {k:"qual",n:"品質",i:"💎",c:"#ce82ff",d:"#a95fdb"},
 {k:"team",n:"チーム・資源",i:"🤝",c:"#21c16b",d:"#159a52"},
 {k:"stake",n:"ステークホルダ",i:"📣",c:"#ff8a3d",d:"#dc6a20"},

 {k:"svc",n:"サービス・戦略",i:"📈",c:"#3b82f6",d:"#2563c9"},
 {k:"law",n:"法務・契約",i:"⚖️",c:"#8b5cf6",d:"#6d3fd6"},
 {k:"sec",n:"セキュリティ",i:"🛡️",c:"#64748b",d:"#475569"}];

const Q=window.AM2, QID=Object.fromEntries(Q.map(q=>[q.id,q]));
const LESSON_SIZE=5;
const UNITS=CATS.map(c=>{const qs=Q.filter(q=>q.cat===c.k);const ls=[];for(let i=0;i<qs.length;i+=LESSON_SIZE)ls.push({id:c.k+"-"+(i/LESSON_SIZE),qs:qs.slice(i,i+LESSON_SIZE).map(q=>q.id)});return{...c,lessons:ls,total:qs.length}}).filter(u=>u.total);
const srcs=q=>[].concat(q.src||[]);
const TITLES=["見習いメンバー","メンバー","サブリーダー","チームリーダー","プロジェクトリーダー","プロジェクトマネージャ","シニアPM","PMO長","プログラムマネージャ","ポートフォリオマネージャ","伝説のPM"];

const HEART_MAX=5, HEART_MS=20*60*1000;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

/* ================= ストア ================= */
const KEY="pmquest.v1";
const DEF={xp:0,goal:50,days:{},streak:0,best:0,last:null,shield:0,hearts:HEART_MAX,hTs:0,q:{},lessons:{},badges:{},pm1:{},pm2:{},mock:[],sound:true,combo:0,maxCombo:0,totalOk:0,totalAns:0,onboard:false};
let S;
function load(){try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S={...DEF}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
function regenHearts(){if(S.hearts>=HEART_MAX){S.hTs=0;return}const n=Math.floor((Date.now()-S.hTs)/HEART_MS);if(n>0){S.hearts=Math.min(HEART_MAX,S.hearts+n);S.hTs=S.hearts>=HEART_MAX?0:S.hTs+n*HEART_MS;save()}}
function checkStreakDecay(){const t=today();if(!S.last)return;const d=dayDiff(S.last,t);if(d>1){if(S.shield>0&&d===2){S.shield--;S.last=new Date(Date.now()-864e5).toISOString().slice(0,10);toast("🛡️ ストリークシールドで連続記録を守りました！")}else{S.streak=0}save()}}
function todayXP(){return S.days[today()]||0}

/* ================= サウンド（桜井流：アタック強め・残響ほどほど・影響度で優先順位） ================= */
// 優先度（大→小）：レベルアップ ＞ レッスン完了/宝箱 ＞ コンボ ＞ 正解 ＞ 不正解 ＞ 選択 ＞ UIタップ
let AC,MG,NZ;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.attack.value=.002;comp.release.value=.12;MG=AC.createGain();MG.gain.value=.95;MG.connect(comp).connect(AC.destination);const len=AC.sampleRate*.6|0,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;NZ=b}if(AC.state==="suspended")AC.resume();return AC}
function osc(f,dur,st=0,type="sine",v=.2,f2){const a=ac(),t=a.currentTime+st,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MG);o.start(t);o.stop(t+dur+.02)}
function noise(dur,st=0,v=.2,hp=2000,lp=12000){const a=ac(),t=a.currentTime+st,s=a.createBufferSource(),g=a.createGain(),h=a.createBiquadFilter(),l=a.createBiquadFilter();s.buffer=NZ;h.type="highpass";h.frequency.value=hp;l.type="lowpass";l.frequency.value=lp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(h).connect(l).connect(g).connect(MG);s.start(t);s.stop(t+dur+.02)}
const play=fn=>{if(!S.sound)return;try{fn()}catch(e){}};
const semi=n=>Math.pow(2,n/12);
const SFX={
 tap:()=>play(()=>{noise(.02,0,.08,3500);osc(1000,.035,0,"triangle",.05)}),
 sel:()=>play(()=>{noise(.018,0,.12,4500);osc(1320,.045,0,"square",.035)}),
 // 正解：コンボごとに半音ずつ上がる（最大1オクターブ）。出だしにノイズのアタック
 ok:(c=1)=>play(()=>{const k=semi(Math.min(c-1,12));noise(.035,0,.24,1800);osc(784*k,.07,0,"square",.07);osc(1046*k,.2,.045,"triangle",.22);osc(2093*k,.18,.045,"sine",.05)}),
 ng:()=>play(()=>{noise(.06,0,.2,150,900);osc(196,.14,0,"square",.07,110);osc(131,.18,.05,"triangle",.12,92)}),
 combo:c=>play(()=>{const k=semi(Math.min(c,16)/2);[0,4,7,12].forEach((n,i)=>osc(659*k*semi(n),.11,i*.045,"square",.06));osc(659*k*2,.35,.18,"triangle",.12);noise(.12,.16,.07,6000)}),
 tick:(i=0)=>play(()=>osc(1400+Math.min(i,40)*22,.028,0,"square",.028)),
 quick:()=>play(()=>{osc(1568,.05,0,"square",.05);osc(2349,.1,.045,"square",.045)}),
 heart:()=>play(()=>{osc(330,.12,0,"sine",.15,165);noise(.05,0,.1,300,1500)}),
 fin:p=>play(()=>{noise(.08,0,.22,700);const s=p?[0,4,7,12,16,19,24]:[0,4,7,12];s.forEach((n,i)=>osc(523*semi(n),.16,i*.065,"triangle",.17));const L=s.length*.065;osc(523*semi(s[s.length-1]),.55,L,"sine",.12);osc(523*semi(s[s.length-1]-5),.55,L,"sine",.07)}),
 lv:()=>play(()=>{[[0,0],[4,.09],[7,.18],[12,.27]].forEach(([n,t])=>{osc(523*semi(n),.1,t,"square",.07);osc(523*semi(n+7),.1,t,"square",.035)});[0,4,7].forEach(n=>osc(1046*semi(n),.8,.38,"triangle",.13));noise(.5,.38,.06,6500)}),
 shake:i=>play(()=>{noise(.07,0,.14+i*.06,140,900);osc(110+i*35,.1,0,"triangle",.16,70)}),
 open:r=>play(()=>{noise(.35,0,.26,900);osc(392,.07,0,"square",.08);[0,4,7,11,12,16,19].slice(0,3+r).forEach((n,i)=>osc(784*semi(n),.22,.05+i*.055,"triangle",.15));osc(1568*semi(r*2),.9,.42,"sine",.09)}),
 badge:()=>play(()=>{[0,7,12,16].forEach((n,i)=>osc(659*semi(n),.18,i*.08,"triangle",.16));noise(.3,.3,.05,7000)}),
 quest:()=>play(()=>{osc(988,.07,0,"square",.06);osc(1319,.22,.06,"triangle",.17);noise(.04,0,.1,3000)}),
 streak:()=>play(()=>{noise(.25,0,.12,400,4000);[0,7,12].forEach((n,i)=>osc(440*semi(n),.2,.08+i*.07,"sawtooth",.05));osc(880*semi(7),.5,.3,"triangle",.12)})};
/* ===== 疑似ハプティクス =====
 Android：Vibration API ／ iPhone（iOS 18以降のSafari）：非表示のスイッチ型チェックボックスを切り替えたときに鳴る端末の触覚を利用 */
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const CANVIB=typeof navigator.vibrate==="function"&&!IOS;
const EMBED=(()=>{try{return window.top!==window.self}catch(e){return true}})();
// iOS 18+ Safari：switch型チェックボックスのラベルをクリックすると端末の触覚が鳴る（毎回新しく作って head に入れ、display:none にする方式）
function iosTick(){try{const l=document.createElement("label");l.ariaHidden="true";l.style.display="none";const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");l.appendChild(i);document.head.appendChild(l);l.click();document.head.removeChild(l)}catch(e){}}
const HP={light:8,select:6,medium:16,heavy:28,success:[12,50,22],error:[28,40,28],combo:[10,30,10,30,24],big:[24,40,24,40,60]};
let lastHap=0;
function buzz(p){if(S.noHaptic)return;try{if(CANVIB){navigator.vibrate(p)}else if(IOS){const now=performance.now();if(now-lastHap<35)return;lastHap=now;iosTick();const n=Array.isArray(p)?Math.ceil(p.length/2):1;for(let k=1;k<n;k++)setTimeout(iosTick,k*90)}}catch(e){}}
const haptic=k=>buzz(HP[k]||HP.light);
function hapticFor(el){if(el.matches(".btn.ng,.chestbtn,.chest,.ov.chesting,#askY,#hpTest"))return"heavy";if(el.matches(".btn,.qa,.node,.li"))return"medium";if(el.matches(".ch"))return"select";return"light"}
const HSEL="button,a.btn,.li,.node,.qa,.chip,label.check,summary,select,.ov.chesting";
// Android：押した瞬間（pointerdown）。iPhone：タップ確定（click）＝ユーザー操作の中で必ず呼ぶ
document.addEventListener("pointerdown",e=>{if(!CANVIB)return;const el=e.target.closest(HSEL);if(el&&!el.disabled)haptic(hapticFor(el))},{passive:true,capture:true});
document.addEventListener("click",e=>{if(!IOS||!e.isTrusted||HOV)return;const el=e.target.closest(HSEL);if(el&&!el.disabled)haptic(hapticFor(el))},{capture:true});
/* iOS 26.5以降対策：指が触れた瞬間、ボタンの上に透明な本物のスイッチ（label＋switch）を重ね、
   指で実際にスイッチを切り替えさせて端末の触覚を鳴らす。切り替え後、元のボタンへクリックを転送する */
const HOV_SKIP="input,textarea,select,label.check,.wa,a[href]:not(.btn)";
let HOV=null,HOVt=null,HOVxy=null;
function hovHide(){if(HOV){HOV.style.display="none"}HOVt=null}
if(IOS){
 HOV=document.createElement("label");HOV.className="hov";HOV.setAttribute("aria-hidden","true");HOV.innerHTML='<input type="checkbox" switch tabindex="-1">';
 document.addEventListener("DOMContentLoaded",()=>document.body.appendChild(HOV));if(document.body)document.body.appendChild(HOV);
 const inp=HOV.querySelector("input");
 inp.addEventListener("click",e=>{e.stopPropagation();const t=HOVt;hovHide();if(t&&t.isConnected&&!t.disabled)setTimeout(()=>t.click(),0)});
 HOV.addEventListener("click",e=>{if(e.target===HOV)e.stopPropagation()});
 document.addEventListener("touchstart",e=>{if(S.noHaptic||e.touches.length>1){hovHide();return}const el=e.target.closest(HSEL);if(!el||el.disabled||el.matches(HOV_SKIP)||el.closest(".hov")){hovHide();return}
  const r=el.getBoundingClientRect(),t=e.touches[0];HOVt=el;HOVxy=[t.clientX,t.clientY];Object.assign(HOV.style,{display:"block",left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"})},{passive:true,capture:true});
 document.addEventListener("touchmove",e=>{if(!HOVt||!HOVxy)return;const t=e.touches[0];if(Math.hypot(t.clientX-HOVxy[0],t.clientY-HOVxy[1])>10)hovHide()},{passive:true,capture:true});
 document.addEventListener("touchcancel",hovHide,{capture:true});
 addEventListener("scroll",hovHide,{passive:true,capture:true});
}
function hapticEnv(){if(IOS)return{m:"iPhone方式（iOS 18以降のSafariのスイッチ触覚）",ok:true};if(CANVIB)return{m:"Android方式（Vibration API）",ok:true};return{m:"この端末・ブラウザは振動に未対応です",ok:false}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= エフェクト（ヒットマーク・振動・フラッシュ・紙吹雪） ================= */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function sizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}sizeCv();addEventListener("resize",sizeCv);
const COLS=["#5b4cf5","#21c16b","#ffb21e","#ff4d8d","#1cb0f6","#ff7a1a","#ce82ff"];
function confetti(n=140,y=.35){if(RM)n=Math.min(n,30);for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.3,y:innerHeight*y,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,g:.32,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COLS[i%COLS.length],life:150+Math.random()*60,sh:Math.random()<.3?"c":"r"});run()}
function burst(x,y,c="#21c16b",n=14){for(let i=0;i<n;i++){const a=Math.PI*2*i/n,s=3+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.12,w:5,h:5,r:0,vr:0,c,life:34,sh:"c"})}run()}
// ヒットマーク：衝撃波リング＋火花。暗い縁取りで明るい背景でも見える。短く消す
function hitmark(x,y,c,pw=1){parts.push({t:"ring",x,y,rad:10,vr:7*pw,life:15,max:15,c,lw:5*pw});const n=8;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.35,s=(6+Math.random()*4)*pw;parts.push({t:"spark",x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,a,len:(16+Math.random()*8)*pw,life:13,max:13,c})}parts.push({t:"star",x,y,s:26*pw,life:10,max:10,c:"#fff"});run()}
function drawP(p){const k=p.life/p.max;
 if(p.t==="ring"){p.rad+=p.vr;p.vr*=.82;cx.globalAlpha=k;cx.lineWidth=p.lw+3;cx.strokeStyle="rgba(20,18,40,.35)";cx.beginPath();cx.arc(p.x,p.y,p.rad,0,7);cx.stroke();cx.lineWidth=p.lw;cx.strokeStyle=p.c;cx.stroke();return}
 if(p.t==="spark"){p.x+=p.vx;p.y+=p.vy;p.vx*=.8;p.vy*=.8;p.len*=.88;const ex=p.x+Math.cos(p.a)*p.len,ey=p.y+Math.sin(p.a)*p.len;cx.globalAlpha=Math.min(1,k*1.5);cx.lineCap="round";cx.lineWidth=7;cx.strokeStyle="rgba(20,18,40,.35)";cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(ex,ey);cx.stroke();cx.lineWidth=4;cx.strokeStyle=p.c;cx.stroke();return}
 if(p.t==="star"){const s=p.s*(1.3-k*.3);cx.globalAlpha=k;cx.save();cx.translate(p.x,p.y);cx.rotate((1-k)*.6);cx.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.32:s,a=i*Math.PI/4;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fillStyle=p.c;cx.strokeStyle="rgba(20,18,40,.3)";cx.lineWidth=2;cx.fill();cx.stroke();cx.restore();return}
 p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.sh==="c"){cx.beginPath();cx.arc(0,0,p.w/2,0,7);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
function run(){if(raf)return;const step=()=>{cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+40);for(const p of parts){cx.save();drawP(p);cx.restore()}if(parts.length)raf=requestAnimationFrame(step);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight)}};raf=requestAnimationFrame(step)}
// 振動：最初に強く→収束、少しランダム。大中小で揺れ方のパターン自体を変える
function jolt(el,amp,ms,mode="xy"){if(!el||!el.animate||RM)return;const n=Math.max(4,Math.round(ms/28)),kf=[];for(let i=0;i<=n;i++){const a=amp*Math.pow(1-i/n,1.4),sx=i%2?1:-1;kf.push({transform:`translate(${mode!=="y"?sx*a*(.6+Math.random()*.4):0}px,${mode!=="x"?(Math.random()*2-1)*a:0}px)`})}kf.push({transform:"none"});el.animate(kf,{duration:ms,easing:"linear"})}
function shakeScreen(size){if(S.noShake)return;const el=$("#lesson")||$("#app");({s:()=>jolt(el,3,170,"y"),m:()=>jolt(el,6,260),l:()=>jolt(el,10,420)})[size]()}

function addXP(n){const before=levelOf(S.xp);S.xp+=n;const t=today();S.days[t]=(S.days[t]||0)+n;
 if(S.last!==t){if(S.last&&dayDiff(S.last,t)===1)S.streak++;else S.streak=1;S.last=t;S.best=Math.max(S.best,S.streak);S._streakUp=Date.now();if(S.streak%7===0&&S.shield<2){S.shield++;setTimeout(()=>toast("🛡️ 7日連続ボーナス：ストリークシールド獲得！"),1200)}}
 save();renderTop();qprog("xp",n);const after=levelOf(S.xp);if(after>before)setTimeout(()=>levelUp(after),L?1900:700);checkBadges()}
function levelUp(lv){SFX.lv();flash("#ffb21e");shakeScreen("l");confetti(200);buzz([30,40,30,40,60]);modal(`<div class="rays"><div class="big lvpop">🎖️</div></div><h2 style="margin:10px 0 4px">レベル ${lv+1} に到達！</h2><p>称号：<b>${titleOf(lv)}</b></p><p class="muted">次のレベルまで ${lvXP(lv+1)-S.xp} XP</p><button class="btn gold" onclick="closeModal()">やったね！</button>`)}
/* ===== デイリークエスト（目的を目の前に吊るす） ===== */
const QPOOL=[{k:"ok",n:"10問正解する",g:10,i:"✅"},{k:"c5",n:"5連続正解を出す",g:1,i:"🔥"},{k:"ls",n:"レッスンを2回クリア",g:2,i:"⭐"},{k:"pf",n:"パーフェクトを1回",g:1,i:"👑"},{k:"pm1",n:"記述問題に1問挑戦",g:1,i:"✍️"},{k:"xp",n:"80XP獲得する",g:80,i:"🍯"},{k:"qk",n:"10秒以内の正解を5回",g:5,i:"⚡"},{k:"wk",n:"苦手復習をクリア",g:1,i:"🧠"}];
function dq(){const t=today();if(!S.dq||S.dq.d!==t){let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;const pool=[...QPOOL],pick=[];for(let i=0;i<3;i++){h=(Math.imul(h,1103515245)+12345)>>>0;pick.push(pool.splice(h%pool.length,1)[0].k)}S.dq={d:t,ks:pick,p:{},done:{},bonus:false};save()}return S.dq}
function qprog(k,n=1){const d=dq();if(!d.ks.includes(k)||d.done[k])return;const q=QPOOL.find(x=>x.k===k);d.p[k]=Math.min(q.g,(d.p[k]||0)+n);save();
 if(d.p[k]>=q.g){d.done[k]=true;save();setTimeout(()=>{SFX.quest();haptic("success");toast(`🎯 クエスト達成「${q.n}」 +20XP`);addXP(20);if(d.ks.every(x=>d.done[x])&&!d.bonus){d.bonus=true;save();setTimeout(()=>openChest("デイリークエスト全達成！",2),1500)}},L?400:200)}}
function questHTML(){const d=dq();const all=d.ks.every(x=>d.done[x]);return `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🎯 今日のクエスト</h3><span class="muted">${all?"全達成！🍯":"全達成でハニーポット"}</span></div>${d.ks.map(k=>{const q=QPOOL.find(x=>x.k===k),p=d.p[k]||0,dn=d.done[k];return `<div class="qrow ${dn?"dn":""}"><span class="qi">${dn?"✅":q.i}</span><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${q.n}</div><div class="gauge"><i style="width:${p/q.g*100}%;background:${dn?"var(--ok)":"var(--gold)"}"></i></div></div><span class="muted" style="font-weight:800">${p}/${q.g}</span></div>`}).join("")}</div>`}

  <div class="row" style="padding:8px 4px"><span style="flex:1;font-size:14px">1日の目標</span><select id="gl" style="padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card)">${[20,50,100,150].map(g=>`<option ${S.goal===g?"selected":""} value="${g}">${g} XP</option>`).join("")}</select></div>
  <div class="grid2" style="margin-top:8px"><button class="btn ghost sm" style="width:100%" onclick="exportData()">📤 引き継ぎコード発行</button><button class="btn ghost sm" style="width:100%" onclick="importData()">📥 コードで復元</button></div>
  <div class="muted" style="margin-top:8px">登録不要のため，記録はこの端末のブラウザに保存されます。機種変更や別の端末へは「引き継ぎコード」で移せます。</div>
  <button class="btn ghost sm" style="width:100%;margin-top:12px;color:var(--ng)" onclick="ask('すべての記録を消去しますか？','消去する',()=>{try{localStorage.removeItem(KEY)}catch(e){}load();go('home')})">記録をリセット</button></div>
 <button class="btn sky" style="margin-top:18px" onclick="share('プロマネ試験の対策アプリ「PM試験クエスト」で勉強中🐝 🔥'+S.streak+'日連続・Lv.'+(levelOf(S.xp)+1))">🔗 友だちにシェア</button>
 <div class="foot">PM試験クエストは個人学習用の非公式アプリです。IPA（独立行政法人情報処理推進機構）とは関係ありません。過去問題の使用についてはIPAの「試験の過去問題の使用方法」に基づき出典を明記しています。</div>`;
 $("#main").innerHTML=h;
 $("#snd").onchange=e=>{S.sound=e.target.checked;save();SFX.tap()};$("#hpTest").onclick=()=>{const was=S.noHaptic;S.noHaptic=false;haptic("big");S.noHaptic=was;toast(hapticEnv().ok?"振動しましたか？（しない場合は上の注意を確認）":"この環境は振動に未対応です")};$("#hpt").onchange=e=>{S.noHaptic=!e.target.checked;save();haptic("success")};$("#shk").onchange=e=>{S.noShake=!e.target.checked;save();if(!S.noShake)shakeScreen("m")};$("#gl").onchange=e=>{S.goal=+e.target.value;save();toast("目標を更新しました")}}
function exportData(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));modal(`<h2 style="margin:0 0 8px">引き継ぎコード</h2><p class="muted">全文をコピーして，新しい端末の「コードで復元」に貼り付けてください。</p><textarea class="wa" readonly style="font-size:11px;min-height:140px">${code}</textarea><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.value).then(()=>toast('コピーしました'))">コピー</button><div style="height:8px"></div><button class="btn ghost" onclick="closeModal()">閉じる</button>`)}
function importData(){modal(`<h2 style="margin:0 0 8px">コードで復元</h2><textarea class="wa" id="imp" placeholder="引き継ぎコードを貼り付け"></textarea><button class="btn" onclick="try{const d=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));S=Object.assign({},DEF,d);save();closeModal();toast('復元しました！');go('home')}catch(e){toast('コードが正しくありません')}">復元する</button><div style="height:8px"></div><button class="btn ghost" onclick="closeModal()">キャンセル</button>`)}

/* ================= 起動 ================= */
checkStreakDecay();regenHearts();go("home");
setInterval(()=>{if(!L&&!ES)renderTop()},30000);
</script>
</body>
</html>
