<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">

<title>PM試験クエスト｜プロジェクトマネージャ試験 対策</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<meta property="og:description" content="IPAプロジェクトマネージャ試験の午前Ⅱ・午後Ⅰ・午後Ⅱを、毎日ちょっとずつゲーム感覚で。登録不要・無料。">

<meta name="description" content="IPAプロジェクトマネージャ試験の午前Ⅱ・午後Ⅰ・午後Ⅱをゲーム感覚で。登録不要・無料。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#ffb300;--pri-d:#d98a00;--pri-l:#fff3d2;--pri-t:#9a5a00;--pri-ink:#3d2600;
  --ok:#21c16b;--ok-d:#159a52;--ok-l:#dcfbe9;
  --ng:#ff4d5e;--ng-d:#d93041;--ng-l:#ffe3e6;
  --gold:#ffb21e;--gold-d:#e08f00;--fire:#ff7a1a;
  --sky:#1cb0f6;--sky-d:#1693cf;
  --ink:#1d1b33;--sub:#6b6987;--line:#e6e4f0;--bg:#f7f6fc;--card:#fff;
  --r:18px;--sh:0 2px 0 var(--line);
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f1f0ff;--sub:#a8a6c6;--line:#2e2c48;--bg:#13121f;--card:#1c1b2e;--pri-l:#3a2c0c;--pri-t:#ffcf5a;--ok-l:#11351f;--ng-l:#3d1820}}
:root[data-theme=dark]{--ink:#f1f0ff;--sub:#a8a6c6;--line:#2e2c48;--bg:#13121f;--card:#1c1b2e;--pri-l:#3a2c0c;--pri-t:#ffcf5a;--ok-l:#11351f;--ng-l:#3d1820}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"LINE Seed JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.5;font-feature-settings:"palt" 1;font-kerning:normal;text-spacing-trim:trim-start;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
textarea,input,select{font-family:inherit;font-size:16px;color:var(--ink)}
#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
/* top bar */
.top{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top))!important;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:2px solid var(--line)}
.brand{font-weight:700;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.brand b{color:var(--pri-t)}
.stats{display:flex;gap:12px;font-weight:700;font-size:15px}
.stat{display:flex;align-items:center;gap:3px}
.stat.fire{color:var(--fire)}.stat.gem{color:var(--sky)}.stat.heart{color:var(--ng)}
.stat.dim{filter:grayscale(1);opacity:.5}
main{flex:1;padding:16px 16px calc(96px + var(--safe-b))}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:30;background:var(--card);border-top:2px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;border-radius:14px;font-size:11px;font-weight:700;color:var(--sub);border:2px solid transparent}
.nav button .ic{font-size:24px;line-height:1.2}
.nav button.on{color:var(--pri-t);background:var(--pri-l);border-color:color-mix(in srgb,var(--pri) 35%,transparent)}
/* cards & buttons */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 3px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:16px;font-weight:700;font-size:16px;letter-spacing:.04em;background:var(--pri);color:var(--pri-ink);box-shadow:0 4px 0 var(--pri-d);transition:transform .06s,box-shadow .06s,filter .2s;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--pri-d)}
.btn.ok,.btn.ng,.btn.sky{color:#fff}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.ng{background:var(--ng);box-shadow:0 4px 0 var(--ng-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#4a2e00}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
.btn.ghost{background:var(--card);color:var(--pri-t);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:12px}
.btn[disabled]{background:var(--line);color:var(--sub);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 70%,#000 8%);pointer-events:none}
h2{font-size:20px;margin:22px 0 10px;font-weight:700;line-height:1.2}
h3{font-size:17px;margin:0 0 6px;font-weight:700;line-height:1.25}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--pri-l);color:var(--pri-t)}
.pill.gold{background:#fff3d6;color:#9a6400}.pill.ok{background:var(--ok-l);color:var(--ok-d)}.pill.ng{background:var(--ng-l);color:var(--ng-d)}
@media (prefers-color-scheme:dark){.pill.gold{background:#3a2c0c;color:#ffcf6b}}
/* hero */
.hero{display:flex;gap:14px;align-items:center}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none;transition:--p 1s}
.ring>div{color:var(--ink);width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:13px;line-height:1.1;text-align:center}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;text-align:left;font-weight:700;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .06s,box-shadow .06s;position:relative;overflow:hidden}
.qa:active{transform:translateY(4px);box-shadow:none}
.qa .e{font-size:26px}.qa small{font-weight:400;font-size:12px;opacity:.92}
.qa.a{background:linear-gradient(135deg,#ff8a3d,#ff5f6d)}.qa.b{background:linear-gradient(135deg,#7b61ff,#5b4cf5)}.qa.c{background:linear-gradient(135deg,#1cb0f6,#3b82f6)}.qa.d{background:linear-gradient(135deg,#22c55e,#0ea371)}
.qa .badge{position:absolute;top:8px;right:10px;background:#fff;color:var(--ng);font-size:11px;padding:0 7px;border-radius:99px}
/* path */
.unit{margin:26px 0 6px;border-radius:18px;padding:14px 16px;color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unit small{display:block;font-weight:400;font-size:12px;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:34px 0 20px}
.node{position:relative;width:72px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:28px;transition:transform .1s}
.node .disc{position:absolute;inset:0;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--cd)}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node .ico{position:relative;z-index:1;transition:transform .1s;color:#fff;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.node:active .ico{transform:translateY(5px)}
.node.todo .disc{background:var(--line);box-shadow:0 7px 0 color-mix(in srgb,var(--line) 70%,#000 12%)}
.node.todo .ico{filter:grayscale(1);opacity:.5}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--c);opacity:.35;animation:pulse 1.6s infinite}
.node .stars{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);display:flex;gap:1px;padding:3px 7px;background:var(--card);border:2px solid var(--line);border-radius:99px;box-shadow:0 2px 0 var(--line);z-index:2;white-space:nowrap}
.node .stars .emo{width:17px;height:17px;vertical-align:0}
.node .stars .emo.off{filter:grayscale(1);opacity:.28}
.node.gold .disc{background:linear-gradient(160deg,#FFE27A,#FFB800);box-shadow:0 7px 0 #D98A00}
.node.gold:active .disc{box-shadow:0 2px 0 #D98A00}
.node.gold .stars{border-color:#FFD24A;box-shadow:0 2px 0 #F0B400,0 0 12px rgba(255,190,0,.45)}
.node .ico .emo{width:40px;height:40px;vertical-align:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.bubble{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--c);border:2px solid var(--line);font-weight:700;font-size:13px;padding:4px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;z-index:3}
.bubble::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
/* lesson */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 16px 6px}
.x{font-size:26px;color:var(--sub);width:32px;line-height:1}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok);transition:width .45s cubic-bezier(.3,1.4,.5,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.4)}
.bar.fire i{background:linear-gradient(90deg,#ffb21e,#ff5f1a,#ff2d55);background-size:200% 100%;animation:flow 1.2s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.lbody{flex:1;overflow:auto;padding:10px 16px 28px}
.lbody,.modal,.verdict .ex{--ft:0px;--fb:0px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft),#000 calc(100% - var(--fb)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--ft),#000 calc(100% - var(--fb)),transparent 100%)}
.nav::before{content:"";position:absolute;left:0;right:0;bottom:calc(100% + 2px);height:28px;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg));pointer-events:none}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.qtext{font-size:17px;font-weight:700;line-height:1.4;white-space:pre-wrap;letter-spacing:.01em}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ch{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:15px;line-height:1.4;transition:transform .06s,box-shadow .06s,border-color .15s,background .15s}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ch .k{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--sub)}
.ch.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--card));box-shadow:0 4px 0 var(--sky)}
.ch.sel .k{border-color:var(--sky);color:var(--sky)}
.ch.right{border-color:var(--ok);background:var(--ok-l);box-shadow:0 4px 0 var(--ok)}
.ch.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--ng);background:var(--ng-l);box-shadow:0 4px 0 var(--ng);animation:shake .4s}
.ch.wrong .k{background:var(--ng);border-color:var(--ng);color:#fff}
.ch.lock{pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.lfoot{padding:14px 16px calc(14px + var(--safe-b));border-top:2px solid var(--line);background:var(--bg);transition:background .2s}
.lfoot.ok{background:var(--ok-l);border-color:transparent}.lfoot.ng{background:var(--ng-l);border-color:transparent}
.verdict{display:none;margin-bottom:12px}
.lfoot.ok .verdict,.lfoot.ng .verdict{display:block;animation:up .25s ease-out}
.verdict .t{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.lfoot.ok .t{color:var(--ok-d)}.lfoot.ng .t{color:var(--ng-d)}
.verdict .ex{font-size:14px;margin-top:6px;max-height:34vh;overflow:auto;line-height:1.5}
@keyframes up{from{transform:translateY(16px);opacity:0}}
table.t{border-collapse:collapse;margin:12px 0;font-size:13px;width:100%;background:var(--card);border-radius:12px;overflow:hidden}
table.t td,table.t th{border:1.5px solid var(--line);padding:5px 7px;text-align:center}
table.t tr:first-child td{background:var(--pri-l);font-weight:700}
.combo{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:60;font-weight:700;font-size:22px;color:var(--fire);text-shadow:0 2px 0 #fff;pointer-events:none;animation:pop .9s forwards}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.6);opacity:0}25%{transform:translate(-50%,0) scale(1.15);opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
.xpf{position:fixed;z-index:61;font-weight:700;color:var(--gold-d);pointer-events:none;animation:xpf 1s forwards;font-size:18px}
@keyframes xpf{to{transform:translateY(-60px);opacity:0}}
.timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--sub);min-width:60px;text-align:right}
.timer.warn{color:var(--ng);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
/* overlay / modal */
.ov{position:fixed;inset:0;z-index:80;background:rgba(15,12,40,.5);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:24px;padding:24px 20px 20px;width:100%;max-width:400px;text-align:center;animation:zoom .35s cubic-bezier(.3,1.5,.5,1);max-height:88vh;overflow:auto}
@keyframes zoom{from{transform:scale(.7);opacity:0}}
.big{font-size:56px;line-height:1.1}
.rays{position:relative}
.rays::before{content:"";position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;background:repeating-conic-gradient(from 0deg,rgba(255,178,30,.25) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:90;animation:up .25s;max-width:90%}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:100;width:100%;height:100%}
/* results */
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:24px 16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border-radius:16px;border:2px solid var(--c);overflow:hidden;text-align:center;min-width:0}
.tile b{display:block;background:var(--c);color:#fff;font-size:12px;padding:3px}
.tile span{display:block;font-size:22px;font-weight:700;padding:10px 4px;color:var(--c);white-space:nowrap}
/* mascot */
.mascot{width:120px;height:120px}
.mascot.s{width:64px;height:64px;flex:none}
.mascot.logo{width:30px;height:30px;margin:-2px 0}
.mascot .wg{transform-origin:60px 44px;animation:flap .18s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.72)}}
.jump{animation:jump .6s ease-out}
@keyframes jump{30%{transform:translateY(-16px) scale(1.05,.95)}60%{transform:translateY(0) scale(.97,1.03)}}
.say{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;font-size:14px}
/* lists */
.li{display:flex;gap:12px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line);text-align:left;width:100%;margin-bottom:10px;transition:transform .06s,box-shadow .06s}
.li:active{transform:translateY(3px);box-shadow:none}
.li .e{font-size:26px;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--pri-l)}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:15px;line-height:1.3}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:99px;border:2px solid var(--line);font-weight:700;font-size:13px;background:var(--card)}
.chip.on{background:var(--pri);border-color:var(--pri-t);color:#fff}
/* writing */
.wa{width:100%;min-height:120px;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);resize:vertical;line-height:1.65;outline:none;transition:border-color .2s}
.wa:focus{border-color:var(--pri-t)}
.wa.tall{min-height:42vh}
.cnt{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-top:6px}
.gauge{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--ng);transition:width .2s,background .2s;border-radius:9px}
.gauge .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;padding:9px 0;border-radius:12px;border:2px solid var(--line);font-weight:700;background:var(--card)}
.tabs button.on{border-color:var(--pri-t);color:var(--pri-t);background:var(--pri-l)}
.scen{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--pri);border-radius:14px;padding:14px;font-size:15px;line-height:1.55}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--ok);flex:none;margin-top:2px}
/* stats */
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat div{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat .l1{background:#ffe9a8}.heat .l2{background:#ffd04d}.heat .l3{background:#f5a300}.heat .l4{background:#b86e00}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg div{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:10.5px;font-weight:700;gap:4px;line-height:1.3}
.bdg .m{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,#ffd76a,#ffa600);box-shadow:0 4px 0 #d48a00}
.bdg .off .m{background:var(--line);box-shadow:0 4px 0 color-mix(in srgb,var(--line) 70%,#000 12%);filter:grayscale(1);opacity:.55}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;color:var(--sub);height:100%}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--pri);min-height:3px;transition:height .6s cubic-bezier(.3,1.4,.5,1)}
.bars .today i{background:var(--gold)}
.catbar{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0}
.catbar .n{width:132px;flex:none;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.catbar .b{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.catbar .b i{display:block;height:100%;border-radius:9px}
.foot{font-size:11px;color:var(--sub);line-height:1.5;margin-top:26px}
.foot a{color:var(--sub)}
.fade-in{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}

{"id":"h26-1","src":["H26春 問1","H28春 問1"],"cat":"int","q":"情報システムの企画，開発，運用，保守作業に関わる国際標準の一つであるSPA（Software Process Assessment）の説明として，適切なものはどれか。","ch":["ソフトウェアプロセスがどの程度の能力水準にあり，継続的に改善されているかを判定することを目的としている。","ソフトウェアライフサイクルを合意プロセス，テクニカルプロセス，運用・サービスプロセスなどのプロセス群に分け，作業内容を定めている。","品質保証に関する要求項目を体系的に規定した国際規格の一部である。","プロジェクトマネジメントの知識体系と応用のためのガイドである。"],"a":0,"ex":"SPA（ISO/IEC 15504 系）は「プロセスの能力水準を評価し改善につなげる」ための枠組み。イは共通フレーム（SLCP），ウはISO 9000系，エはPMBOKの説明。"},
{"id":"h26-2","src":"H26春 問2","cat":"int","fig":"lifecycle","q":"図は一般的なプロジェクトにおける開始から終結までの時間の経過に伴って変動する要素を表している（a は時間とともに小さくなり，b は時間とともに大きくなる）。a，b に対応する要素の適切な組はどれか。","ch":["a：ステークホルダの影響力　b：要件変更への対応コスト","a：プロジェクト要員数　b：リスク","a：要件変更への対応コスト　b：プロジェクト要員数","a：リスク　b：ステークホルダの影響力"],"a":0,"ex":"ステークホルダの影響力（と不確実性・リスク）は初期が最大で徐々に小さくなる。一方，変更やエラー訂正のコストは終盤ほど大きくなる。要員数は中盤がピークの山型。"},
{"id":"h26-3","src":"H26春 問3","cat":"int","q":"PMBOKにおいて，プロジェクト憲章は，どの知識エリアのどのプロセス群で作成するか。","ch":["プロジェクトコミュニケーションマネジメントの実行プロセス群","プロジェクトスコープマネジメントの計画プロセス群","プロジェクト統合マネジメントの計画プロセス群","プロジェクト統合マネジメントの立上げプロセス群"],"a":3,"ex":"プロジェクト憲章はプロジェクトを公式に認可し，PMに権限を与える文書。統合マネジメントの「立上げ」で作る。"},
{"id":"h26-4","src":"H26春 問4","cat":"int","q":"PMBOKにおける組織のプロセス資産のうち，“企業の知識ベース”に含まれるものはどれか。","ch":["WBSやリスク評価のテンプレート","過去のプロジェクトのパフォーマンスや品質のベースラインなどを含むプロジェクトファイル","使用するコミュニケーション媒体やセキュリティ要求事項","標準化された作業指示書やパフォーマンス測定基準"],"a":1,"ex":"組織のプロセス資産は「プロセスと手順」と「企業の知識ベース」に分かれる。テンプレート・手順・基準は前者，過去のプロジェクトファイルや教訓は後者。"},
{"id":"h26-5","src":"H26春 問5","cat":"stake","q":"PMBOKにおけるプロジェクトとステークホルダの関係の記述として，適切なものはどれか。","ch":["サプライヤは，プロジェクトの成果物を使用する。","スポンサは，契約に基づき必要な構成アイテムやサービスを提供する。","納入者は，資金などの財政的資源を提供する。","プログラムマネージャは，関連するプロジェクトの調和を図り，個々のプロジェクトを支援・指導する。"],"a":3,"ex":"成果物を使うのは顧客・ユーザー，資金を出すのはスポンサ，構成アイテムを提供するのはサプライヤ（納入者）。役割が入れ替えられた選択肢に注意。"},
{"id":"h26-6","src":["H26春 問6","H29春 問4"],"cat":"scope","q":"WBSの作成に用いるローリングウェーブ計画法の説明はどれか。","ch":["WBSを補完するため，WBS要素ごとに詳細な作業の内容などを記述する。","過去に実施したプロジェクトのWBSをテンプレートとして，新たなWBSを作成する。","将来実施される作業については，上位レベルのWBSにとどめておき，詳細が明確になってから，要素分解して詳細なWBSを作成する。","プロジェクトの作業をより詳細化するために，WBSの最下位レベルの作業内容や要素成果物を定義する。"],"a":2,"ex":"近い作業は詳細に，遠い作業は粗く計画し，時間の経過とともに段階的に詳細化する（段階的詳細化）。アはWBS辞書，イはテンプレート活用。"},
{"id":"h26-7","src":["H26春 問7","H28春 問6"],"cat":"team","q":"責任分担表（RAM）の一つであるRACIチャートで示す4種類の役割及び責任の組合せのうち，適切なものはどれか。","ch":["実行責任，情報提供，説明責任，相談対応","実行責任，情報提供，説明責任，リスク管理","実行責任，情報提供，相談対応，リスク管理","実行責任，説明責任，相談対応，リスク管理"],"a":0,"ex":"R=Responsible（実行責任），A=Accountable（説明責任），C=Consulted（相談対応），I=Informed（情報提供）。リスク管理は含まれない。"},
{"id":"h26-9","src":["H26春 問9","H29春 問1"],"cat":"sched","q":"クリティカルチェーン法の特徴（実施例）として，適切なものはどれか。","ch":["クリティカルパス上の作業に，生産性を向上させるための開発ツールを導入する。","クリティカルパス上の作業に，要員を追加投入する。","クリティカルパス上の先行作業が終了する前に後続作業に着手し，並行して実施する。","合流（フィーディング）バッファとプロジェクト（所要期間）バッファを設け，クリティカルパスを守る。"],"a":3,"ex":"CCPMは各作業の安全余裕を取り除き，まとめてバッファとして管理する手法。イはクラッシング，ウはファストトラッキング。"},
{"id":"h26-10","src":"H26春 問10","cat":"int","q":"実績報告のプロセスにおいて，スコープ，コスト，スケジュールのベースラインと実績とのかい離を明確にする技法はどれか。","ch":["what-ifシナリオ分析","傾向分析","差異分析","モンテカルロ分析"],"a":2,"ex":"計画（ベースライン）と実績の差を見るのが差異分析。傾向分析は時間経過に伴う変化，モンテカルロはシミュレーションによる確率的分析。"},
{"id":"h26-11","src":["H26春 問11","H28春 問10"],"cat":"cost","q":"社員が週40時間働くソフトウェア会社が，1人で開発すると440人時のプログラム開発を引き受けた。次の条件で見積もるとき，10人のチームで開発する場合のコストは，1人で開発する場合のコストの約何倍か。\n〔条件〕(1)10人のチームでは，コミュニケーションのための工数が余分に発生する。(2)コミュニケーションはメンバが総当たりでとり，その工数は2人1組の組合せごとに週当たり4人時である。(3)社員の週当たりコストは同じ。(4)その他の条件は無視できる。","ch":["1.2","1.5","1.8","2.1"],"a":2,"ex":"1人なら440÷40＝11人週。10人だと組合せは10C2＝45組で，コミュニケーション工数は45×4＝180人時/週。チーム全体の作業可能時間は400人時/週なので，開発に使えるのは220人時/週 → 440÷220＝2週。コストは10人×2週＝20人週。20÷11≒1.8倍。"},
{"id":"h26-12","src":"H26春 問12","cat":"risk","q":"リスクマネジメントにおけるEMV（期待金額価値）の算出式はどれか。","ch":["影響金額 × 発生確率","影響金額 ÷ 発生確率","影響金額 × 対応コスト","影響金額 ÷ 対応コスト"],"a":0,"ex":"EMV＝影響金額×発生確率。デシジョンツリー分析で各選択肢の期待値を比較するときに使う。"},
{"id":"h26-13","src":["H26春 問13","H28春 問15"],"cat":"risk","q":"PMBOKのリスク対応戦略の適用に関する記述のうち，適切なものはどれか。","ch":["強化は，マイナスのリスクに対して使用される戦略である。","共有は，プラスのリスクとマイナスのリスクのどちらにも使用される戦略である。","受容は，プラスのリスクとマイナスのリスクのどちらにも使用される戦略である。","転嫁は，プラスのリスクに対して使用される戦略である。"],"a":2,"ex":"脅威（マイナス）：回避・転嫁・軽減。好機（プラス）：活用・共有・強化。両方に使えるのは「受容」（第6版では「エスカレーション」も両方）。"},
{"id":"h26-15","src":"H26春 問15","cat":"qual","q":"品質管理に用いるパレート図の用途として，適切なものはどれか。","ch":["工程の時系列の状態を示し，工程が安定しているかどうかを判断する。","項目別の出現度数を大きい順に並べ，累積和を示して，主要な原因を識別する。","二つの特性の間に相関があるかどうかを判断する。","特性と要因の関係を樹形図で示し，影響関係を分析する。"],"a":1,"ex":"パレート図＝重点指向（少数の原因が大半を占める）。アは管理図，ウは散布図，エは特性要因図。"},
{"id":"h26-16","src":"H26春 問16","cat":"qual","q":"エラー埋込み法において，100個のエラーを埋め込んだプログラムを検査したところ，30個のエラーが発見され，そのうち20個が埋め込んだエラーであった。埋め込んだエラーを除く残存エラー数は幾つと推定されるか。","ch":["40","50","70","150"],"a":0,"ex":"埋込みエラーの発見率は20/100＝20％。固有エラーも同率で発見されたとみなすと，固有エラーの発見数10個 → 総数は10÷0.2＝50個。残存は50−10＝40個。"},
{"id":"h26-17","src":["H26春 問17","H28春 問19"],"cat":"dev","q":"XP（eXtreme Programming）のプラクティスの一つに取り入れられているものはどれか。","ch":["構造化プログラミング","コンポーネント指向プログラミング","ビジュアルプログラミング","ペアプログラミング"],"a":3,"ex":"XPの代表的プラクティス：ペアプログラミング，テスト駆動開発，リファクタリング，継続的インテグレーションなど。"},
{"id":"h26-18","src":"H26春 問18","cat":"dev","q":"開発方針 a〜c に対応する開発モデルの組合せとして，適切なものはどれか。\na：全機能を一斉に開発する。\nb：コアとなる部分を開発し，機能を順次追加していく。\nc：開発を繰り返しながら要求を洗練していく。","ch":["a：ウォータフォール　b：進化的　c：段階的","a：ウォータフォール　b：段階的　c：進化的","a：進化的　b：ウォータフォール　c：段階的","a：段階的　b：進化的　c：ウォータフォール"],"a":1,"ex":"段階的（インクリメンタル）＝機能を少しずつ追加。進化的＝要求自体を繰り返しの中で洗練。"},
{"id":"h26-20","src":"H26春 問20","cat":"svc","tbl":[["","セキュリティ強化(重み4)","運用品質向上(重み2)","作業コスト削減(重み3)","スケジュールリスク(重み8)","技術リスク(重み3)"],["案1","3","2","5","2","4"],["案2","4","4","4","4","1"],["案3","5","2","2","1","5"],["案4","2","5","4","5","1"]],"q":"四つの案を，効果3項目とリスク2項目で採点した（表）。総合評価点＝効果の重み付き合計−リスクの重み付き合計 とするとき，総合評価点が最も高い案はどれか。","ch":["案1","案2","案3","案4"],"a":2,"ex":"案1：(12+4+15)−(16+12)＝3。案2：(16+8+12)−(32+3)＝1。案3：(20+4+6)−(8+15)＝7。案4：(8+10+12)−(40+3)＝−13。案3が最高。"},
{"id":"h26-21","src":"H26春 問21","cat":"law","q":"ランニングロイヤリティの説明として，適切なものはどれか。","ch":["技術サポートを受ける際に課される技術料","技術の開示を受ける際に課される一時金","特許発明の実施実績に応じて決まる使用料","毎年のメンテナンス費用として課される料金"],"a":2,"ex":"ランニングロイヤリティは売上や生産数など「実施の実績」に応じて継続的に支払う使用料。一時金はイニシャルペイメント。"},
{"id":"h26-22","src":"H26春 問22","cat":"law","q":"下請代金支払遅延等防止法に照らして，禁止されている行為はどれか。","ch":["継続的な取引で，支払条件などを記載した書面をあらかじめ交付し，個々の発注書面ではその記載を省略する。","顧客の都合による仕様変更に伴う費用増加分を，協議のうえ下請代金に加算する。","発注時に仕様が未確定の書面を交付し，仕様確定後は書面ではなく口頭で伝える。","振込手数料を下請事業者が負担する旨を書面で合意し，実費の範囲で差し引いて支払う。"],"a":2,"ex":"親事業者には発注内容を書面（3条書面）で交付する義務がある。未定事項が確定したら，直ちに補充の書面を交付しなければならない。口頭は不可。"},
{"id":"h26-23","src":"H26春 問23","cat":"svc","q":"コンティンジェンシープランの留意点として，適切なものはどれか。","ch":["全システムを対象とせず，復旧の重要性と緊急性を考慮して対象を決める。","バックアップデータは，コンピュータ室内又はセンタ内に保存しておく。","バックアップ対象は，機密情報の中から機密度に応じて選ぶ。","被害シナリオを作成し，それに基づく予防策の策定手順を立てる。"],"a":0,"ex":"コンティンジェンシープランは「起きた後」の緊急時対応計画。優先度で対象を絞る。バックアップは遠隔地保管が原則。エの予防策は別の話。"},
{"id":"h26-24","src":"H26春 問24","cat":"sec","q":"メールサーバ（SMTPサーバ）の不正利用を防止するために行う設定はどれか。","ch":["ゾーン転送のアクセス元を制限する。","第三者中継を禁止する。","ディレクトリのファイル名表示を禁止する。","特定のディレクトリ以外でのCGIプログラムの実行を禁止する。"],"a":1,"ex":"第三者中継（オープンリレー）を許すとスパムの踏み台にされる。アはDNS，ウ・エはWebサーバの設定。"},
{"id":"h26-25","src":"H26春 問25","cat":"sec","q":"SSLに関する記述のうち，適切なものはどれか。","ch":["ディジタル証明書にはIPアドレスの組込みが必須であり，IPアドレス変更時には証明書の再取得が必要である。","個人認証用のディジタル証明書はICカードなどに格納でき，格納場所を特定のPCに限定する必要はない。","特定の利用者間の通信のために開発されたもので，Webサーバへの事前の利用者登録が不可欠である。","日本国内では，SSLで使用する共通鍵の長さは128ビット未満に制限されている。"],"a":1,"ex":"クライアント証明書はICカード等に格納し持ち運べる。サーバ証明書はFQDNに対して発行され，IPアドレスは必須ではない。"},
{"id":"h27-1","src":"H27春 問1","cat":"int","q":"ISO 21500によれば，プロジェクトガバナンスを維持する責任は誰にあるか。","ch":["プロジェクトの管理面でプロジェクトマネージャを支援するプロジェクトマネジメントチーム","プロジェクトの立上げから終結までのプロセスを指揮するプロジェクトマネージャ","プロジェクトの要求事項を明確にし，プロジェクトの成果を享受する顧客","プロジェクトを承認して経営的判断を下すプロジェクトスポンサ，又は上級経営レベルでの指導をするプロジェクト運営委員会"],"a":3,"ex":"ガバナンスはPMより上位の視点で監督する仕組み。その維持責任はスポンサや運営委員会にある。"},
{"id":"h27-2","src":["H27春 問2","H29春 問14"],"cat":"cost","q":"工程別の生産性が，設計工程 X ステップ/人月，製造工程 Y ステップ/人月，試験工程 Z ステップ/人月 であるとき，全体の生産性（ステップ/人月）を表す式はどれか。（選択肢の数式は表記を簡略化）","ch":["X + Y + Z","(X + Y + Z) ÷ 3","1/X + 1/Y + 1/Z","1 ÷ (1/X + 1/Y + 1/Z)"],"a":3,"ex":"1ステップ当たりの工数は各工程の 1/X，1/Y，1/Z の合計。全体の生産性はその逆数 1/(1/X+1/Y+1/Z)。"},
{"id":"h27-3","src":["H27春 問3","H29春 問2"],"cat":"int","q":"PMBOKによれば，組織のプロセス資産に分類されるものはどれか。","ch":["課題と欠陥のマネジメントの手順","ステークホルダのリスク許容度","組織のインフラストラクチャ","組織の文化，体制，ガバナンス"],"a":0,"ex":"手順・テンプレート・教訓＝組織のプロセス資産。リスク許容度，インフラ，文化・体制は組織体の環境要因（EEF）。"},
{"id":"h27-4","src":"H27春 問4","cat":"sched","tbl":[["工程","工数比","期間比"],["要件定義","0.17","0.25"],["外部設計","0.21","0.21"],["内部設計","0.16","0.11"],["プログラム開発","0.16","0.11"],["システム結合","0.11","0.11"],["システムテスト","0.19","0.21"]],"q":"過去の実績から構築した作業分配モデル（表）がある。要件定義から内部設計までをモデルどおりに進め，228日で完了してプログラム開発を開始した。現在，200本のプログラムのうち100本を完了し，残り100本は未着手である。以降もモデルどおりに進むとき，プロジェクト全体の完了まであと何日掛かるか。","ch":["140","150","161","172"],"a":1,"ex":"期間比で考える。要件定義〜内部設計＝0.25+0.21+0.11＝0.57 → 228日なので全体は400日。残りはプログラム開発の半分0.055＋結合0.11＋テスト0.21＝0.375 → 400×0.375＝150日。"},
{"id":"h27-5","src":["H27春 問5","H29春 問6"],"cat":"team","tbl":[["要員","要件定義","設計","開発","テスト"],["阿部","C","R","A","I"],["伊藤","A","I","−","I"],["佐藤","I","I","R","C"],["鈴木","I","C","−","R"],["田中","I","C","R","A"],["野村","R","A","I","C"]],"q":"表のRACIチャートにおいて，“設計”アクティビティで説明責任（Accountable）をもつ要員は誰か。","ch":["阿部","伊藤と佐藤","鈴木と田中","野村"],"a":3,"ex":"設計列の A は野村。なお A（説明責任）は1アクティビティにつき1人に限るのが原則。"},
{"id":"h27-6","src":"H27春 問6","cat":"team","q":"ブルックスの法則が述べていることはどれか。","ch":["エンゲージメントが高まると，メンバは問題に自律的に対応するようになる。","技術が高度化するほど，人を中心としたマネジメントが重要になる。","担当者の業務を可視化しなければ，優秀なPMでも適切な管理はできない。","遅延しているプロジェクトへの要員の追加は，更なる遅れをもたらす。"],"a":3,"ex":"「遅れているプロジェクトに人を追加すると，さらに遅れる」。教育コストとコミュニケーション経路の増加が原因。"},
{"id":"h27-7","src":"H27春 問7","cat":"sched","q":"クリティカルチェーン法におけるスケジューリングとバッファの設定方法として，適切なものはどれか。","ch":["クリティカルパス上にないタスクのチェーンには，バッファを設定しない。","クリティカルパス上の最後のタスクの終了と納期の間に，プロジェクト全体で使用するバッファを設定する。","クリティカルパス上の全てのタスクに，バッファを設定する。","なるべく前倒しでタスクを開始するように計画し，バッファを少しでも多く確保する。"],"a":1,"ex":"末尾にプロジェクトバッファ，非クリティカルチェーンの合流点に合流（フィーディング）バッファを置く。個々のタスクには余裕を持たせない。"},
{"id":"h27-8","src":["H27春 問8","H29春 問8"],"cat":"sched","q":"工程管理図表の特徴に関する記述のうち，ガントチャートのものはどれか。","ch":["計画と実績の時間的推移を表現するのに適し，進み具合及びその傾向がよく分かり，プロジェクト全体の費用と進捗の管理に利用される。","作業の順序や作業相互の関係を表現したり，重要作業を把握したりするのに適しており，プロジェクトの作業計画などに利用される。","作業の相互関係の把握には適さないが，作業計画に対する実績を把握するのに適しており，個人やグループの進捗管理に利用される。","マイルストーンを把握するのに適しており，プロジェクト全体の進捗管理に利用される。"],"a":2,"ex":"ガントチャートは横棒で計画と実績を比較できるが，作業間の依存関係は分かりにくい。アはSカーブ（EVM），イはアローダイアグラム，エはマイルストーンチャート。"},
{"id":"h27-9","src":["H27春 問9","H29春 問9"],"cat":"sched","q":"プロジェクトマネジメントにおけるクラッシングの例として，適切なものはどれか。","ch":["クリティカルパス上で遅れているアクティビティに人員を増強した。","コストを削減するために，これまで承認されていた残業を禁止した。","仕様確定の遅れにより，プロジェクトの完了予定日を延期した。","設計が完了したモジュールから順に並行してプログラム開発を行うよう，スケジュールを変更した。"],"a":0,"ex":"クラッシング＝コストを追加して（資源投入で）期間を短縮。エはファストトラッキング（作業の並行化）。"},
{"id":"h27-10","src":["H27春 問10","H29春 問12"],"cat":"cost","q":"EVMを採用したプロジェクトで，ある時点のCPIが1.0を下回っている場合の対処として，適切なものはどれか。","ch":["実コストが予算コストを下回っているので，CPIに基づき完成時総コストを下方修正する。","実コストをCPIで割った値を使い，完成時総コストを見積もって予想値とする。","超過コストの原因を明確にし，CPIの改善策に取り組むとともに，CPIの値を監視する。","完成時にはCPIが1.0になることを利用し，CPIが1.0となる完成時期を予測してスケジュールを見直す。"],"a":2,"ex":"CPI＝EV/AC。1未満はコスト超過。原因を特定して是正し，監視を続けるのが正しい対処。EACの典型式は BAC/CPI（ACをCPIで割るのではない）。"},
{"id":"h27-11","src":["H27春 問11","H29春 問13"],"cat":"cost","q":"ファンクションポイント法の一つであるIFPUG法では，機能をデータファンクションとトランザクションファンクションとに分類する。適切な分類はどれか。（EI：外部入力，EO：外部出力，EQ：外部照会，ILF：内部論理ファイル，EIF：外部インタフェースファイル）","ch":["データ：EI，EO，EQ　／トランザクション：EIF，ILF","データ：EIF，EQ，ILF　／トランザクション：EI，EO","データ：EIF，ILF　／トランザクション：EI，EO，EQ","データ：ILF　／トランザクション：EI，EIF，EO，EQ"],"a":2,"ex":"“ファイル”が付く ILF・EIF がデータファンクション。入出力・照会の EI・EO・EQ がトランザクションファンクション。"},
{"id":"h27-12","src":"H27春 問12","cat":"risk","q":"定性的リスク分析で使用されるものはどれか。","ch":["感度分析","期待金額価値分析","デシジョンツリー分析","発生確率・影響度マトリックス"],"a":3,"ex":"定性的分析＝発生確率と影響度で優先順位付け（P-Iマトリックス）。感度分析・EMV・デシジョンツリーは定量的分析。"},
{"id":"h27-13","src":"H27春 問13","cat":"qual","q":"プロジェクトの品質コストを適合コストと不適合コストに分類したとき，適合コストに属するものはどれか。","ch":["クレーム調査費","損害賠償費","品質保証の教育訓練費","プログラム不具合の修正費"],"a":2,"ex":"適合コスト＝予防コスト（教育，計画）＋評価コスト（テスト，検査）。不適合コスト＝内部・外部の失敗コスト（修正，クレーム，賠償）。"},
{"id":"h27-14","src":"H27春 問14","cat":"qual","q":"品質の定量的評価指標のうち，ソフトウェアの保守性の評価指標になるものはどれか。","ch":["最終成果物に含まれる誤りの件数 ÷ 最終成果物の量","修正時間の合計 ÷ 修正件数","移植時に変更が必要なソースコードの行数 ÷ 移植するソースコードの行数","利用者からの改良要求件数 ÷ 出荷後の経過月数"],"a":1,"ex":"保守性＝修正のしやすさ。1件当たりの平均修正時間が指標になる。アは信頼性（欠陥密度），ウは移植性。"},
{"id":"h27-15","src":"H27春 問15","cat":"law","q":"ソフトウェア開発を外部委託した。日程は計画どおりに全工程を終えたが，受入れテストで委託範囲の設計不良による欠陥が多数見つかった。〔要点〕委託はソフトウェア方式設計から結合までを一括発注，過去の評価が最も高い供給者を選定，毎月1回進捗確認，成果物は全工程終了時に一括検査。取得者が実施すべき再発防止策として最も適切なものはどれか。","ch":["同じ供給者を選ばないよう，その供給者の開発実績の評点を下げる。","各開発工程の区切りで成果物を提出させて検査し，品質問題があれば原因を特定させて是正させる。","進捗確認で，設計書のページ数，プログラムの行数，テストケース数などの定量的な報告を求める。","進捗確認の頻度を毎月1回から毎週1回に変更する。"],"a":1,"ex":"問題は「最後に一括検査」で品質を途中確認していなかったこと。工程ごとに成果物をレビューすれば早期に設計不良を検出できる。"},
{"id":"h27-16","src":"H27春 問16","cat":"dev","q":"利用者が誤った操作をしても問題が起きないように，あらかじめ対策しておくという考え方を表す用語はどれか。","ch":["フールプルーフ","フェールセーフ","フェールソフト","フォールトトレラント"],"a":0,"ex":"フールプルーフ＝誤操作を防ぐ。フェールセーフ＝故障時に安全側へ。フェールソフト＝機能を縮退して継続。フォールトトレラント＝冗長化で継続。"},
{"id":"h27-17","src":"H27春 問17","cat":"dev","q":"リーンソフトウェア開発の説明として，適切なものはどれか。","ch":["経験的プロセス制御の理論を基本としており，スプリントと呼ばれる周期で“検査と適応”を繰り返しながら開発する。","製造業の現場から生まれた考え方を応用したもので，“ムダをなくす”，“品質を作り込む”といった七つの原則を示している。","比較的小規模な開発に適したプログラミング中心の手法であり，五つの価値を定義している。","利用者から見て価値がある機能単位ごとに，設計や構築などの五つのプロセスを繰り返して開発する。"],"a":1,"ex":"リーンはトヨタ生産方式由来。アはスクラム，ウはXP，エはFDD（ユーザ機能駆動開発）。"},
{"id":"h27-18","src":["H27春 問18","H29春 問17"],"cat":"dev","q":"マッシュアップを利用してWebコンテンツを表示している例として，最も適切なものはどれか。","ch":["Webブラウザにプラグインを組み込み，動画やアニメーションを表示する。","地図上のカーソル移動に伴い，Webページを切り替えずにスクロール表示する。","鉄道経路の探索結果上に，各鉄道会社のWebページへのリンクを表示する。","店舗案内のWebページ上に，他のサイトが提供する地図検索機能を利用して出力された情報を表示する。"],"a":3,"ex":"マッシュアップ＝複数サービスのAPIや機能を組み合わせて新しいコンテンツを作ること。イはAjax，ウは単なるリンク。"},
{"id":"h27-19","src":"H27春 問19","cat":"svc","q":"ITサービスマネジメントにおける，インシデント及びサービス要求管理の主な活動はどれか。","ch":["インシデントの影響を最小限にするための既知の誤り記録の作成","インシデントの解決とサービスの復旧","インシデントの傾向分析と予防処置","インシデントの未知の根本原因の特定"],"a":1,"ex":"インシデント管理の目的は「サービスをできるだけ早く復旧すること」。根本原因の特定・既知の誤り・傾向分析は問題管理の活動。"},
{"id":"h27-20","src":"H27春 問20","cat":"svc","tbl":[["費用項目（百万円）","A案","B案","C案","D案"],["ハードウェア導入","30","30","40","40"],["システム開発","30","50","30","40"],["導入教育","5","5","5","5"],["ネットワーク通信/年","20","20","15","15"],["保守/年","6","5","5","5"],["システム運用/年","6","4","6","4"]],"q":"表の4案について，3年間使用した場合のTCO（総所有費用）が最小となる案はどれか。","ch":["A案","B案","C案","D案"],"a":2,"ex":"初期＋年額×3。A：65+32×3＝161，B：85+29×3＝172，C：75+26×3＝153，D：85+24×3＝157。C案が最小。"},
{"id":"h27-21","src":"H27春 問21","cat":"dev","q":"非機能要件のうち，使用性に該当するものはどれか。","ch":["4時間以内のトレーニングを受けることで，新しい画面を操作できるようになる。","業務量がピークの日でも，8時間以内に夜間バッチ処理を完了できる。","現行システムから新システムへ，72時間以内に移行できる。","大規模災害時でも，144時間以内にシステムを復旧できる。"],"a":0,"ex":"使用性（ユーザビリティ）＝習得のしやすさ・使いやすさ。イは性能効率性，ウは移行性，エは可用性・事業継続。"},
{"id":"h27-22","src":"H27春 問22","cat":"law","q":"不正競争防止法で保護されるものはどれか。","ch":["特許権を取得した発明","頒布されている独自のシステム開発手順書","秘密として管理している，事業活動用の非公開の顧客名簿","秘密として管理していない，自社システム開発用の重要な設計書"],"a":2,"ex":"営業秘密の3要件：秘密管理性・有用性・非公知性。秘密管理していないもの，公開済みのものは対象外。特許は特許法で保護。"},
{"id":"h27-23","src":"H27春 問23","cat":"law","q":"広告宣伝のための電子メールを送信する場合，特定電子メール法に照らして適切なものはどれか。","ch":["送信の許諾を通知する手段をメールに表示しておけば，同意を得ていない不特定多数に送信できる。","同意を得ていない不特定多数に送る場合は，件名に未承諾広告であることを明示する。","取引関係などの一定の場合を除き，あらかじめ送信に同意した者だけに送るオプトイン方式をとる。","メールアドレスを自動生成するプログラムで送信する場合は，送信者の氏名と連絡先を明示する。"],"a":2,"ex":"現行法はオプトイン方式。事前同意のない相手への広告メールは原則禁止。「未承諾広告※」表示は旧制度。"},
{"id":"h27-24","src":"H27春 問24","cat":"sec","q":"米国NISTが制定したAESにおける鍵長の条件はどれか。","ch":["128ビット，192ビット，256ビットから選択する。","256ビット未満で任意に指定する。","暗号化処理単位のブロック長より32ビット長くする。","暗号化処理単位のブロック長より32ビット短くする。"],"a":0,"ex":"AESのブロック長は128ビット固定，鍵長は128/192/256ビットから選ぶ。"},
{"id":"h27-25","src":"H27春 問25","cat":"sec","q":"テンペスト技術の説明とその対策として，適切なものはどれか。","ch":["ディスプレイなどから放射される電磁波を傍受し，表示内容を盗み見る技術であり，対策として電磁波を遮断する。","通信途中のパケットを横取りし，内容を改ざんする技術であり，対策としてディジタル署名で改ざんを検知する。","マクロウイルスで使われる技術であり，対策としてウイルス対策ソフトを導入し最新の定義ファイルを適用する。","無線LANの信号を傍受し，通信内容を解析する技術であり，対策として通信パケットを暗号化する。"],"a":0,"ex":"テンペスト＝機器が出す微弱な電磁波から情報を盗む攻撃。シールドなどで電磁波を遮断して防ぐ。"},
{"id":"h28-3","src":"H28春 問3","cat":"int","q":"PMBOKによれば，多くのプロジェクトのライフサイクルに共通する特性はどれか。","ch":["プロジェクト完成時のコストに対してステークホルダが及ぼす影響の度合いは，プロジェクトの終盤が最も高い。","プロジェクトの不確実性の度合いは，プロジェクトの開始時が最も高い。","プロジェクト要員の必要人数は，プロジェクトの終了時が最も多い。","変更やエラー訂正に掛かるコストは，プロジェクトの初期段階が最も高い。"],"a":1,"ex":"不確実性とステークホルダの影響力は開始時が最大。変更コストは終盤ほど高い。要員数は中盤がピーク。"},
{"id":"h28-4","src":"H28春 問4","cat":"int","q":"プロジェクトの開始を公式に承認する文書の作成を依頼された者の行動として，適切なものはどれか。","ch":["契約書を作成し，プロジェクトマネージャに文書の承認を求めた。","プロジェクト憲章を作成し，プロジェクトスポンサに文書の承認を求めた。","プロジェクト作業範囲記述書を作成し，プロジェクトマネージャに文書の承認を求めた。","プロジェクトマネジメント計画書を作成し，プロジェクトスポンサに文書の承認を求めた。"],"a":1,"ex":"プロジェクトを公式に認可する文書＝プロジェクト憲章。承認するのはスポンサ（立ち上げる側）。"},
{"id":"h28-5","src":"H28春 問5","cat":"scope","q":"プロジェクトマネジメントにおけるスコープコントロールの活動はどれか。","ch":["開発ツールの新機能の教育が必要と分かったので，開発ツールの教育期間を2日間延長した。","要件定義完了時に再見積りをしたところ，当初見積もった開発費用を超過することが判明したので，追加予算を確保した。","連携する計画であった外部システムのリリースが延期になったので，この外部システムとの連携に関わる作業は別プロジェクトで実施することにした。","割り当てたテスト担当者が期待した成果を出せなかったので，経験豊富なテスト担当者に交代した。"],"a":2,"ex":"作業範囲（スコープ）そのものを変更しているのはウだけ。アはスケジュール，イはコスト，エは資源のコントロール。"},
{"id":"h28-7","src":"H28春 問7","cat":"sched","q":"PMBOKにおいて，アクティビティの所要期間を見積もる際の資源カレンダーの用途として，適切なものはどれか。","ch":["アクティビティが必要とする資源の種類と量を特定する。","アクティビティが必要とする資源を区分と類型別に階層表示し，必要な資源を明確にする。","アクティビティが必要とする資源を利用できる作業日及びシフトを取得する。","過去のプロジェクトにおいて類似のアクティビティが必要とした資源の種類と量を取得する。"],"a":2,"ex":"資源カレンダー＝その資源がいつ使えるか（稼働日・シフト）。アは資源要求事項，イは資源ブレークダウンストラクチャー。"},
{"id":"h28-9","src":"H28春 問9","cat":"int","q":"プロジェクト管理で使用する分析技法のうち，傾向分析の説明はどれか。","ch":["個々の選択肢とそれぞれを選択した場合に想定されるシナリオの関係を図に表し，それぞれのシナリオにおける期待値を計算して，最善の策を選択する。","個々のリスクが現実のものとなったときの，プロジェクトの目標に与える影響の度合いを調べる。","時間の経過に伴うプロジェクトのパフォーマンスの変動を分析する。","発生した障害とその要因の関係を，魚の骨のような図にして分析する。"],"a":2,"ex":"傾向（トレンド）分析＝時系列での変化を見て将来を予測。アはデシジョンツリー，イは感度分析，エは特性要因図。"},
{"id":"h28-12","src":"H28春 問12","cat":"risk","tbl":[["選択肢","費用","効果大(確率60%)","効果小(確率40%)"],["ツールA導入","120万円","X 万円","90万円"],["ツールB導入","60万円","120万円","60万円"]],"q":"表のデシジョンツリーのデータで，EMV（期待金額価値）を用いてツールAとツールBを比較する。ツールAを導入する場合のEMVがツールBを導入する場合のEMVを上回るのは，Xが幾らより大きい場合か。","ch":["120","150","200","240"],"a":2,"ex":"A：0.6X＋0.4×90−120＝0.6X−84。B：0.6×120＋0.4×60−60＝36。0.6X−84＞36 → X＞200。"},
{"id":"h28-13","src":"H28春 問13","cat":"risk","q":"プロジェクトのリスクを，デルファイ法を利用して抽出しているものはどれか。","ch":["ステークホルダや経験豊富なプロジェクトマネージャといった専門家にインタビューし，回答を収集してリスクとしてまとめる。","複数のお互いに関係がない専門家にアンケートを行い，その結果を要約する。さらに要約結果を用いてアンケートを行い，結果を要約することを繰り返してリスクをまとめる。","プロジェクトチームのメンバにPMOのメンバやステークホルダを加え，一堂に会して会議をし，意見を出し合い，進行役がリスクとしてまとめる。","プロジェクトを強み，弱み，好機，脅威のそれぞれの観点及びその組合せで分析し，リスクをまとめる。"],"a":1,"ex":"デルファイ法＝匿名の専門家アンケートを繰り返し，意見を収束させる。アはインタビュー，ウはブレーンストーミング，エはSWOT分析。"},
{"id":"h28-14","src":"H28春 問14","cat":"risk","q":"PMBOKによれば，定性的リスク分析で実施することとして，適切なものはどれか。","ch":["感度分析によって，プロジェクトに与える影響が大きいリスクを明確にする。","定量的リスク分析の結果に基づいて，リスクの優先順位付けをする。","リスク対応計画に基づいて，発生するおそれがあるリスクを具体的に特定する。","リスクの発生確率と影響度を査定した結果に基づいて，リスク登録簿を更新する。"],"a":3,"ex":"順番は 特定 → 定性的分析 → 定量的分析 → 対応計画。定性的分析では発生確率・影響度を査定してリスク登録簿を更新する。"},
{"id":"h28-16","src":"H28春 問16","cat":"dev","q":"JIS X 0160において，“開発者は，ソフトウェア結合のために暫定的なテスト要求事項及びスケジュールを定義し，文書化する。”というタスクを実施するプロセスはどれか。","ch":["ソフトウェア結合","ソフトウェア詳細設計","ソフトウェア適格性確認テスト","ソフトウェア方式設計"],"a":3,"ex":"V字モデルで，方式設計は結合テストと対になる。方式設計の段階で結合テストの要求事項とスケジュールを暫定的に定める。"},
{"id":"h28-17","src":"H28春 問17","cat":"dev","q":"フェールセーフの考えに基づいて設計したものはどれか。","ch":["乾電池のプラスとマイナスを逆にすると，乾電池が装塡できないようにする。","交通管制システムが故障したときには，信号機に赤色が点灯するようにする。","ネットワークカードのコントローラを二重化しておき，故障したコントローラの方を切り離しても運用できるようにする。","ハードディスクにRAID1を採用して，MTBFで示される信頼性が向上するようにする。"],"a":1,"ex":"故障時に安全側（全赤＝止まれ）に倒すのがフェールセーフ。アはフールプルーフ，ウ・エはフォールトトレランス。"},
{"id":"h28-18","src":"H28春 問18","cat":"dev","q":"CMMIの目的として，最も適切なものはどれか。","ch":["各種のソフトウェア設計・開発技法を使って開発作業を自動化し，ソフトウェア開発の生産性の向上を図る。","共通の物差しとして用いることによって，国内におけるシステム及びソフトウェア開発とその取引の明確化を可能にする。","組織がプロセスを改善することに役立つ，ベストプラクティスの適用に対する手引を提供する。","特定の購入者と製作者の間で授受されるソフトウェア製品の品質保証を行い，顧客満足度の向上を図る。"],"a":2,"ex":"CMMIはプロセス改善のための成熟度モデル（ベストプラクティス集）。イは共通フレームの説明。"},
{"id":"h28-20","src":"H28春 問20","cat":"svc","q":"ITILで定義されるサービスのライフサイクルにおけるサービストランジション段階の説明はどれか。","ch":["規定された要件と制約に沿って，サービスを運用に移行し，確実に稼働させることである。","サービスの効率，有効性，費用対効果の観点で運用状況を継続的に測定し，改善していくことである。","サービスの内容を具体的に決めることである。","戦略的資産として，どのようにサービスマネジメントを設計，開発，導入するかについての手引を提供することである。"],"a":0,"ex":"トランジション＝移行。新規・変更サービスを本番運用へ移す段階。イは継続的サービス改善，ウはサービスデザイン，エはサービスストラテジ。"},
{"id":"h28-21","src":"H28春 問21","cat":"dev","q":"情報システムの設計のうち，フェールソフトの考え方を適用した例はどれか。","ch":["UPSを設置することによって，停電時に手順どおりにシステムを停止できるようにし，データを保全する。","制御プログラムの障害時に，システムの暴走を避け，安全に運転を停止できるようにする。","ハードウェアの障害時に，パフォーマンスは低下するが，構成を縮小して運転を続けられるようにする。","利用者の誤操作や誤入力を未然に防ぐことによって，システムの誤動作を防止できるようにする。"],"a":2,"ex":"フェールソフト＝縮退運転で機能を落としてでも継続。イはフェールセーフ，エはフールプルーフ。"},
{"id":"h28-22","src":"H28春 問22","cat":"svc","q":"IT投資効果の評価に用いられる手法のうち，ROIによるものはどれか。","ch":["一定期間のキャッシュフローを，割引率を設定して現在価値に換算した上で合計値を求め，その大小で評価する。","初年度の投資によるキャッシュアウトフローが何年後に回収できるかによって評価する。","現在価値に換算されたキャッシュフローの一定期間の合計値がゼロとなるような割引率を求め，その大小で評価する。","投資額を分母に，投資による収益を分子とした比率を算出し，その大小で評価する。"],"a":3,"ex":"ROI＝利益÷投資額。アはNPV（正味現在価値），イは回収期間法，ウはIRR（内部収益率）。"},
{"id":"h28-23","src":"H28春 問23","cat":"law","q":"労働基準法及び労働契約法が定める，就業規則に係る使用者の義務の記述のうち，適切なものはどれか。","ch":["就業規則の基準に達しない労働条件を労働契約で定める場合には，使用者が労働者から個別に合意を得ることが義務付けられている。","使用者は，就業規則を労働者に周知するために，見やすい場所に掲示したり，書面を交付したりするなどの措置を行うことが義務付けられている。","常時10名以上の労働者を使用する使用者は，就業規則を作成する義務はあるが，行政官庁へ届け出ることは義務付けられていない。","労働組合がない事業場において，使用者が就業規則を作成する場合，労働者の意見を聴くことは義務付けられていない。"],"a":1,"ex":"就業規則は周知義務あり。アは無効（就業規則の基準が優先），ウは届出義務あり，エは過半数代表者の意見聴取が必要。"},
{"id":"h28-24","src":"H28春 問24","cat":"sec","q":"シャドーITに該当するものはどれか。","ch":["IT製品やITを活用して地球環境への負荷を低減する取組み","IT部門の公式な許可を得ずに，従業員又は部門が業務に利用しているデバイスやクラウドサービス","攻撃対象者のディスプレイやキータイプを物陰から盗み見て，情報を盗み出すこと","ネットワーク上のコンピュータに侵入する準備として，攻撃対象の弱点を探るために個人や組織などの情報を収集すること"],"a":1,"ex":"シャドーIT＝情報システム部門が把握していないIT利用。アはグリーンIT，ウはショルダーハッキング，エはフットプリンティング。"},
{"id":"h28-25","src":"H28春 問25","cat":"sec","q":"DNSSECの機能はどれか。","ch":["DNSキャッシュサーバの設定によって再帰的な問合せの受付範囲が最大になるようにする。","DNSサーバから受け取るリソースレコードに対するディジタル署名を利用して，リソースレコードの送信者の正当性とデータの完全性を検証する。","ISPなどのセカンダリDNSサーバを利用してDNSコンテンツサーバを二重化することによって，名前解決の可用性を高める。","共通鍵暗号技術とハッシュ関数を利用したセキュアな方法によって，DNS更新要求が許可されているエンドポイントを特定して認証する。"],"a":1,"ex":"DNSSECは応答にディジタル署名を付け，キャッシュポイズニングを防ぐ。エはTSIG。"},
{"id":"h29-3","src":"H29春 問3","cat":"int","q":"PMBOK（第5版）における変更要求のうち，是正処置に該当するものはどれか。","ch":["品質が目標に届かないおそれがあるので，今後の工程に有識者をレビューに参加させる。","遅延しているタスクのスケジュールを計画に戻すため，要員を追加する。","受入れテストで見つかった不具合を修正する。","法規制の改定に対応するため，WBSに作業を追加する。"],"a":1,"ex":"是正処置＝計画からずれた実績を計画どおりに戻す。アは予防処置，ウは欠陥修正，エはスコープの変更。"},
{"id":"h29-5","src":"H29春 問5","cat":"scope","q":"WBSにおけるワークパッケージに関する記述として，適切なものはどれか。","ch":["OBSのチームに担当する人員を割り当てたものである。","関連する複数の要素成果物をまとめたものである。","通常，スケジュールアクティビティに分解される。","一つ上位の要素成果物と1対1に対応する。"],"a":2,"ex":"ワークパッケージはWBSの最下位要素で，コストと所要期間を見積もり管理できる単位。スケジュール作成時にアクティビティへ分解する。"},
{"id":"h29-7","src":"H29春 問7","cat":"team","q":"タックマンモデルによれば，チームの発達段階のうち，メンバの異なる考え方や価値観が明確になり，互いに意見を主張し合う段階はどれか。","ch":["安定期（Norming）","遂行期（Performing）","成立期（Forming）","動乱期（Storming）"],"a":3,"ex":"成立期 → 動乱期 → 安定期 → 遂行期 → 散会期。意見がぶつかり合うのは動乱期。"},
{"id":"h29-11","src":"H29春 問11","cat":"dev","q":"アジャイル型開発におけるベロシティの説明として，適切なものはどれか。","ch":["ユーザストーリの相対的な規模を見積もるための単位","完了待ちの要求事項を優先度順に並べたリスト","残作業量の推移を示したグラフ","定められた期間内にチームが完了させた成果物の量を示す，チームの生産性の指標"],"a":3,"ex":"ベロシティ＝1イテレーションで完了したストーリーポイントの量。アはストーリーポイント，イはバックログ，ウはバーンダウンチャート。"},
{"id":"h29-18","src":"H29春 問18","cat":"dev","q":"リファクタリングの説明として，適切なものはどれか。","ch":["外部から見た振る舞いを変えずに，保守性の高いプログラムに書き直す。","ソースコードから設計書を作成する。","既存の部品を組み合わせて開発する。","プログラム修正の影響範囲をテストする。"],"a":0,"ex":"リファクタリングは機能を変えず内部構造を改善すること。イはリバースエンジニアリング，エは回帰テスト。"},
{"id":"h29-19","src":"H29春 問19","cat":"dev","q":"データベースのフルバックアップの取得間隔を2倍にした（差分のログは取得し続ける）。バックアップや復旧に関する記述として，適切なものはどれか。","ch":["1回当たりのフルバックアップの媒体使用量が約2倍になる。","1回当たりのフルバックアップの媒体使用量が約半分になる。","フルバックアップの平均処理時間が約2倍になる。","ログ情報による復旧の平均処理時間が約2倍になる。"],"a":3,"ex":"フルバックアップ1回の量や時間はDBの大きさで決まり，間隔とは無関係。間隔が2倍になると，障害時に適用するログが平均2倍になり復旧時間が延びる。"},
{"id":"h29-20","src":"H29春 問20","cat":"dev","q":"データ管理者（DA）とデータベース管理者（DBA）を別々に任命した場合，DAの役割として適切なものはどれか。","ch":["ディスク増設の計画を立てる。","設計工程で，論理データベースの設計やデータ項目の標準化を行う。","テスト工程で，パフォーマンスチューニングを行う。","障害発生時に，データ復旧や整合性チェックを行う。"],"a":1,"ex":"DAは全社的なデータ資源の管理（論理設計・標準化）を担う。物理的な管理（容量・チューニング・復旧）はDBA。"},
{"id":"h29-22","src":"H29春 問22","cat":"law","q":"いわゆる36協定が根拠とする制度はどれか。","ch":["裁量労働制","1か月単位の変形労働時間制","時間外・休日労働の労使協定を行政官庁に届け出ることで，法定労働時間を超える労働を認める制度","フレックスタイム制"],"a":2,"ex":"労働基準法36条に基づく協定。これがないと法定労働時間を超えて働かせることはできない。"},
{"id":"h29-23","src":"H29春 問23","cat":"law","q":"労働者派遣法において，派遣先責任者の業務として適切なものはどれか。","ch":["派遣労働者の人事記録を作成し，人事考課を行う。","複数の就業場所があっても，事業所全体で一人を選任する。","全ての業務を統括する管理職から選任する。","派遣労働者に指揮命令する者に対して，関係法規や労働者派遣契約の内容を周知する。"],"a":3,"ex":"派遣先責任者は，指揮命令者への法令・契約内容の周知，苦情処理，派遣元との連絡調整などを行う。人事考課は派遣元の役割。"},
{"id":"h29-24","src":"H29春 問24","cat":"sec","q":"CSIRTの説明として，適切なものはどれか。","ch":["個人情報保護に関する体制を整備していることを認定する組織","企業などにおいて，情報セキュリティインシデントに対応するための組織","電子政府で利用する暗号技術を選定・評価する組織","内閣官房に設置された，情報セキュリティ政策を調整する組織"],"a":1,"ex":"CSIRT＝インシデント対応チーム。アはプライバシーマーク関連，ウはCRYPTREC，エはNISC。"},
{"id":"h29-25","src":"H29春 問25","cat":"sec","q":"ペネトレーションテストに該当するものはどれか。","ch":["暗号化で使用している暗号方式と鍵長が，セキュリティポリシで定められた仕様に合っているかを確認する。","システムの入出力が仕様どおりであることを確認する。","ファイアウォールが単位時間当たりに処理できるセッション数を確認する。","ファイアウォールや公開サーバに対して，実際に侵入を試み，不正侵入できないかを確認する。"],"a":3,"ex":"ペネトレーションテスト＝擬似攻撃による侵入テスト。脆弱性が悪用可能かを実際に確かめる。"},
{"id":"h24-ft","src":"H24春 午前Ⅱ","cat":"sched","q":"工期を短縮させるために，クリティカルパス上の作業に“ファストトラッキング”技法を適用した対策はどれか。","ch":["時間外勤務を実施する。","生産性を高められる開発ツールを導入する。","全体の設計が完了する前に，仕様が固まっているモジュールを開発する。","要員を追加投入する。"],"a":2,"ex":"ファストトラッキング＝本来順番に行う作業を並行して進める（手戻りリスクが増える）。ア・エは資源を追加するクラッシング。"},
{"id":"h25-1","src":"H25春 午前Ⅱ","cat":"stake","q":"プロジェクトに関わるステークホルダの説明のうち，適切なものはどれか。","ch":["組織の内部に属しており，組織の外部にいることはない。","プロジェクトに直接参加し，間接的な関与に留まることはない。","プロジェクトの成果が，自らの利益になる者と不利益になる者がいる。","プロジェクトマネージャのように，個人として特定できることが必要である。"],"a":2,"ex":"ステークホルダは組織の内外，直接・間接を問わず，プロジェクトに影響を与える／受けるすべての個人・組織。不利益を受ける者も含む。"},
{"id":"h25-2","src":"H25春 午前Ⅱ","cat":"cost","q":"あるソフトウェア開発部門では，開発工数 E（人月）と開発規模 L（キロ行）との関係が E＝5.2L^0.98 で表される。L＝10 としたときの生産性（キロ行/人月）は，およそ幾らか。","ch":["0.2","0.5","1.9","5.2"],"a":0,"ex":"10^0.98≒9.55 なので E≒5.2×9.55≒49.7人月。生産性＝10÷49.7≒0.2。"},
{"id":"h23-cr","src":"H23 午前Ⅱ","cat":"sched","q":"“クラッシング”を行う際に，優先的に資源を投入すべきスケジュールアクティビティはどれか。","ch":["業務の難易度が最も高いスケジュールアクティビティ","クリティカルパス上のスケジュールアクティビティ","資源が確保できる時期に開始するスケジュールアクティビティ","所要期間を最も長く必要とするスケジュールアクティビティ"],"a":1,"ex":"全体の期間を決めているのはクリティカルパス。そこを短縮しなければ全体は縮まらない（さらに追加コストが最小のものから）。"},
{"id":"o-evm1","orig":1,"cat":"cost","q":"BAC（完成時総予算）が500万円のプロジェクトで，現時点の PV＝100万円，EV＝80万円，AC＝100万円である。今後も現在のコスト効率が続くと仮定したとき，EAC（完成時総コスト見積り）は幾らか。","ch":["580万円","625万円","650万円","500万円"],"a":1,"ex":"CPI＝EV/AC＝0.8。現在の効率が続くなら EAC＝BAC/CPI＝500/0.8＝625万円。（今後は計画どおりなら EAC＝AC＋(BAC−EV)＝520万円）"},
{"id":"o-evm2","orig":1,"cat":"cost","q":"EVMで SV（スケジュール差異）＝−20，CV（コスト差異）＝＋10 となった。この状態の説明として適切なものはどれか。","ch":["進捗もコストも計画より悪化している。","進捗もコストも計画より良好である。","進捗は計画より進んでいるが，コストは超過している。","進捗は計画より遅れているが，コストは予算内に収まっている。"],"a":3,"ex":"SV＝EV−PV（マイナス＝遅れ），CV＝EV−AC（プラス＝予算内）。EVを基準に引き算すると覚えるとよい。"},
{"id":"o-evm3","orig":1,"cat":"cost","q":"BAC＝1,000，EV＝400，AC＝500 のとき，残作業をBACどおりに完了するために必要なTCPI（残作業効率指数）は幾らか。","ch":["1.2","1.5","0.8","1.0"],"a":0,"ex":"TCPI＝(BAC−EV)/(BAC−AC)＝600/500＝1.2。今より20％高い効率で進める必要がある。"},
{"id":"o-pert","orig":1,"cat":"sched","q":"三点見積り（PERT）で，ある作業の楽観値4日，最頻値7日，悲観値16日とした。期待所要期間は何日か。","ch":["7","9.5","8","9"],"a":2,"ex":"(楽観＋4×最頻＋悲観)÷6＝(4＋28＋16)÷6＝8日。標準偏差は(悲観−楽観)÷6＝2日。"},
{"id":"o-cpm1","orig":1,"cat":"sched","tbl":[["作業","所要日数","先行作業"],["A","3","−"],["B","5","−"],["C","4","A，B"],["D","6","B"],["E","2","C，D"]],"q":"表の作業からなるプロジェクトの最短所要日数は何日か。","ch":["15","13","12","11"],"a":1,"ex":"経路：A→C→E＝9，B→C→E＝11，B→D→E＝13。最長の B→D→E がクリティカルパスで13日。"},
{"id":"o-cpm2","orig":1,"cat":"sched","tbl":[["作業","所要日数","先行作業"],["A","3","−"],["B","5","−"],["C","4","A，B"],["D","6","B"],["E","2","C，D"]],"q":"表のプロジェクトで，作業Aのトータルフロート（全余裕日数）は何日か。","ch":["2","5","4","3"],"a":2,"ex":"全体13日。Eの最遅開始は11日目，Cの最遅開始は11−4＝7日目，Aの最遅開始は7−3＝4日目。Aの最早開始は0なのでフロートは4日。"},
{"id":"o-ch","orig":1,"cat":"stake","q":"プロジェクトチームが6人から10人に増えた。メンバ間のコミュニケーションチャネル数は幾つ増えるか。","ch":["4","45","30","15"],"a":2,"ex":"チャネル数＝n(n−1)/2。6人：15，10人：45。差は30。人を増やすとコミュニケーションの負荷は急増する。"},
{"id":"o-dt","orig":1,"cat":"risk","q":"ある障害リスクは，対策をとらないと発生確率30％で損失200万円となる。対策X（費用20万円）を実施すると発生確率は10％に下がる。対策Xを実施した場合の期待損失（対策費用を含む）は幾らか。","ch":["20万円","80万円","40万円","60万円"],"a":2,"ex":"対策X：20＋0.1×200＝40万円。対策なし：0.3×200＝60万円。期待値では対策Xを選ぶべき。"},
{"id":"o-vel","orig":1,"cat":"dev","q":"直近3スプリントのベロシティが平均25ポイントのスクラムチームで，プロダクトバックログの残りが200ポイントある。残りを完了するのに必要なスプリント数の見込みは幾つか。","ch":["6","8","10","12"],"a":1,"ex":"200÷25＝8スプリント。ベロシティは見積りではなく実績値なので，予測に使える。"},
{"id":"o-avail","orig":1,"cat":"svc","q":"MTBF が 990 時間，MTTR が 10 時間のシステムの稼働率は幾らか。","ch":["0.98","0.999","0.995","0.99"],"a":3,"ex":"稼働率＝MTBF/(MTBF＋MTTR)＝990/1000＝0.99。"},
{"id":"o-p7domain","orig":1,"cat":"int","q":"PMBOKガイド第7版で示されるプロジェクト・パフォーマンス領域に含まれないものはどれか。","ch":["開発アプローチとライフサイクル","チーム","調達","ステークホルダー"],"a":2,"ex":"第7版の8つの領域：ステークホルダー，チーム，開発アプローチとライフサイクル，計画，プロジェクト作業，デリバリー，測定，不確かさ。「調達」は第6版までの知識エリア。"},
{"id":"o-p7prin","orig":1,"cat":"int","q":"PMBOKガイド第7版の“プロジェクトマネジメントの原理・原則”に該当するものはどれか。","ch":["計画の変更を最小限に抑えること","予測型の開発アプローチを標準として採用すること","全てのプロジェクトで詳細なWBSを作成すること","勤勉で，敬意を払い，面倒見のよいスチュワードであること"],"a":3,"ex":"第7版は12の原理・原則（スチュワードシップ，チーム，ステークホルダー，価値，システム思考，リーダーシップ，テーラリング，品質，複雑さ，リスク，適応力と回復力，変革）を示す。手法を固定するものではない。"},
{"id":"o-tailor","orig":1,"cat":"int","q":"プロジェクトマネジメントにおける“テーラリング（修整）”の説明として，適切なものはどれか。","ch":["組織の標準プロセスを，例外なくそのまま全プロジェクトに適用すること","コスト超過時に，スコープを縮小して予算内に収めること","プロジェクトの環境や特性に合わせて，アプローチ，ガバナンス，プロセスを意図的に適合させること","プロジェクトの終盤に，未完了の作業を別のプロジェクトに移すこと"],"a":2,"ex":"テーラリングは「標準をそのまま使う」ことでも「好き勝手にやる」ことでもなく，プロジェクトの状況に合わせて意図的に調整すること。近年の午後問題でも頻出。"},
{"id":"o-21500","orig":1,"cat":"int","q":"JIS Q 21500:2018（プロジェクトマネジメントの手引）に示されるプロセス群に含まれないものはどれか。","ch":["計画","立ち上げ","管理","改善"],"a":3,"ex":"JIS Q 21500のプロセス群は 立ち上げ・計画・実行・管理・終結 の5つ。"},
{"id":"o-wbsdic","orig":1,"cat":"scope","q":"WBS辞書の説明として，適切なものはどれか。","ch":["WBSの作成手順を組織の標準として定めた文書","WBSの各要素について，作業内容，成果物，責任者，マイルストーンなどの詳細を記述した文書","プロジェクトで使用する専門用語の定義を集めた文書","過去のプロジェクトのWBSを分類・蓄積したもの"],"a":1,"ex":"WBS辞書はWBSを補完し，各要素の詳細情報を記述する。スコープベースライン＝スコープ記述書＋WBS＋WBS辞書。"},
{"id":"o-creep","orig":1,"cat":"scope","q":"“スコープクリープ”の説明として，適切なものはどれか。","ch":["変更管理の手続を経ずに，作業範囲が少しずつ広がっていくこと","承認された変更要求によってスコープが縮小されること","クリティカルパス上の作業が少しずつ遅れていくこと","WBSを段階的に詳細化していくこと"],"a":0,"ex":"正式な変更管理を経ない小さな追加の積み重ねで，コストや納期が圧迫される。統合変更管理で防ぐ。"},
{"id":"o-rtm","orig":1,"cat":"scope","q":"要求事項トレーサビリティ・マトリックスを用いる目的として，最も適切なものはどれか。","ch":["リスクの発生確率と影響度を可視化する。","作業の依存関係とクリティカルパスを明らかにする。","要員ごとの役割と責任を明確にする。","各要求事項を，その源泉から設計・テストなどの成果物まで追跡し，抜け漏れや不要な実装を防ぐ。"],"a":3,"ex":"要求と成果物を双方向に結びつけ，実装漏れや根拠のない機能（金メッキ）を防ぐ。ウはRAM，イはネットワーク図，アはP-Iマトリックス。"},
{"id":"o-lag","orig":1,"cat":"sched","q":"作業A（5日）と作業B（4日）が“終了−開始（FS）関係，ラグ2日”で結ばれている。作業Aを1日目に開始したとき，作業Bが完了するのは何日目か（土日なし）。","ch":["12日目","10日目","11日目","9日目"],"a":2,"ex":"Aは1〜5日目，ラグ2日（6・7日目は待ち），Bは8日目開始で8〜11日目。11日目に完了。"},
{"id":"o-level","orig":1,"cat":"sched","q":"資源平準化（リソース・レベリング）の説明として，適切なものはどれか。","ch":["クリティカルパス上の作業に資源を追加して期間を短縮する。","資源の制約や過剰割当てを解消するために作業の開始・終了日を調整する。その結果，クリティカルパスが変わることがある。","並行作業を増やして期間を短縮する。","フロートの範囲内だけで資源の使用量をならし，クリティカルパスは変えない。"],"a":1,"ex":"平準化は資源制約を優先するため完了日が延びることもある。エは資源円滑化（スムージング），アはクラッシング，ウはファストトラッキング。"},
{"id":"o-bdc","orig":1,"cat":"dev","q":"スプリントのバーンダウンチャートで，実績線が理想線より常に上側に推移している。この状況の解釈として適切なものはどれか。","ch":["チームのベロシティが向上している。","計画より速いペースで作業が完了している。","残作業が計画より多く，スプリント内に完了できないおそれがある。","スプリントの途中で作業が追加されたことは確実である。"],"a":2,"ex":"バーンダウンは「残作業量」の推移。理想線より上＝残りが多い＝遅れ気味。デイリースクラムで障害を確認する。"},
{"id":"o-est","orig":1,"cat":"cost","q":"過去の類似プロジェクトの実績値を基に，プロジェクト全体のコストを初期段階で概算する見積り手法はどれか。","ch":["パラメトリック見積り","ボトムアップ見積り","類推見積り","三点見積り"],"a":2,"ex":"類推見積り＝トップダウンで早く安いが精度は低い。パラメトリック＝統計的関係（単価×数量など）。ボトムアップ＝WBSの最下位から積み上げて高精度。"},
{"id":"o-reserve","orig":1,"cat":"cost","q":"コンティンジェンシー予備とマネジメント予備に関する記述として，適切なものはどれか。","ch":["両者ともコストベースラインに含め，PMの裁量で使用できる。","マネジメント予備は特定済みのリスクに備え，コンティンジェンシー予備は未知のリスクに備える。","両者ともプロジェクト予算に含めず，必要時に経営層が追加予算として承認する。","コンティンジェンシー予備は特定済みのリスクに備えてコストベースラインに含め，マネジメント予備は未知のリスクに備えてコストベースラインに含めない。"],"a":3,"ex":"既知の未知（特定済みリスク）＝コンティンジェンシー予備（ベースライン内）。未知の未知＝マネジメント予備（ベースライン外，使用には承認が必要）。"},
{"id":"o-ctrl","orig":1,"cat":"qual","q":"管理図において，測定値が管理限界内にあるものの，中心線の片側に7点連続して並んだ。この状況の判断として適切なものはどれか。","ch":["管理限界内なので，プロセスは安定していると判断し何もしない。","管理限界を広げて，今後の判定を緩める。","測定誤差なので，該当データを除外する。","プロセスに何らかの偏りが生じている可能性があるので，原因を調査する。"],"a":3,"ex":"「連（ラン）」と呼ばれる異常パターン。管理限界内でも，片側への連続や上昇・下降傾向は工程の変化のサイン。"},
{"id":"o-coq","orig":1,"cat":"qual","q":"品質コストのうち“評価コスト”に該当するものはどれか。","ch":["設計レビューやテストの実施費用","出荷前に見つかった欠陥の手直し費用","リリース後の障害対応と顧客への補償費用","品質向上のための要員教育の費用"],"a":0,"ex":"予防コスト＝教育・計画（エ），評価コスト＝レビュー・テスト・検査（ア），内部失敗コスト＝出荷前の手直し（イ），外部失敗コスト＝出荷後の対応（ウ）。"},
{"id":"o-grow","orig":1,"cat":"qual","q":"テスト工程で，累積テスト時間に対する累積バグ検出数をプロットした信頼度成長曲線（ゴンペルツ曲線など）が飽和に近づいている。この状況から判断できることとして，最も適切なものはどれか。","ch":["残存バグが少なくなり，品質が収束に向かっている可能性が高い。","バグが急増しており，テストを中止すべきである。","テストケースの品質が低いことが確実である。","テストの網羅性が不足していることが確実である。"],"a":0,"ex":"曲線がS字に寝てくる＝新たなバグが見つかりにくくなった。ただしテスト項目の消化状況と合わせて判断することが前提（消化が進んでいないのに飽和なら要注意）。"},
{"id":"o-fish","orig":1,"cat":"qual","q":"特性要因図の用途として，適切なものはどれか。","ch":["工程が統計的に安定しているかを判断する。","問題（特性）とそれに影響を及ぼす要因を体系的に整理し，原因を洗い出す。","二つの変数の相関関係を把握する。","データの散らばり具合を柱状に表し，分布の形を把握する。"],"a":1,"ex":"いわゆるフィッシュボーン図。エはヒストグラム，ウは散布図，アは管理図。"},
{"id":"o-sl","orig":1,"cat":"team","q":"SL理論（状況対応型リーダーシップ）において，メンバの能力も意欲も十分に高い場合に適したリーダーシップスタイルはどれか。","ch":["委任型","参加（支援）型","説得（コーチ）型","指示型"],"a":0,"ex":"成熟度が低い順に 指示型 → 説得型 → 参加型 → 委任型。高成熟度なら任せて，リーダーの関与を減らす。"},
{"id":"o-servant","orig":1,"cat":"team","q":"サーバントリーダーシップの説明として，適切なものはどれか。","ch":["リーダーが全ての意思決定を行い，メンバには指示どおりの実行を求める。","リーダーのカリスマ性によってメンバを強く引っ張る。","報酬と罰を明確にし，取引関係によってメンバを動かす。","リーダーがメンバに奉仕し，障害を取り除き成長を支援することで，チームの成果を引き出す。"],"a":3,"ex":"支援型リーダーシップ。アジャイル（スクラムマスター）や近年の午後問題（自律型チーム）で頻出。アは指示型，ウは交換型。"},
{"id":"o-psych","orig":1,"cat":"team","q":"チームにおける“心理的安全性”が確保された状態の説明として，最も適切なものはどれか。","ch":["メンバが，対人関係のリスクを恐れずに，自分の考えや懸念，失敗を率直に発言できる状態","リーダーが全ての問題の責任を負い，メンバが責任を問われない状態","メンバが雇用を保障されている状態","メンバ同士の意見の対立が全くない状態"],"a":0,"ex":"心理的安全性は「対立がない」ことではなく「率直に言える」こと。R4午後Ⅰの解答例にも「メンバーの心理的安全性が確保された状況」が登場。"},
{"id":"o-conflict","orig":1,"cat":"team","q":"コンフリクトの解消方法のうち，多様な視点を取り入れ，関係者全員が納得できる解決策を見いだす，最も根本的な解消につながりやすい方法はどれか。","ch":["強制／指示","撤退／回避","妥協／和解","協力／問題解決（対決）"],"a":3,"ex":"協力・問題解決はWin-Winを目指し根本解決につながる。妥協は双方が一部を譲る，強制は一方的，撤退は先送り。"},
{"id":"o-herz","orig":1,"cat":"team","q":"ハーズバーグの二要因理論で，“衛生要因”に該当するものはどれか。","ch":["承認","給与や職場環境","達成感","仕事そのものの面白さ"],"a":1,"ex":"衛生要因（不満を防ぐが満足は生まない）：給与，作業環境，会社の方針，対人関係など。動機付け要因：達成，承認，仕事そのもの，責任，成長。"},
{"id":"o-grid","orig":1,"cat":"stake","q":"権力（影響力）と関心度のグリッドで，“権力は大きいが関心度は低い”ステークホルダへの対応として，適切なものはどれか。","ch":["満足な状態を保つ","監視する（最小限の労力）","注意深く管理する（緊密に連携する）","常に情報を提供する"],"a":0,"ex":"権力大・関心大＝注意深く管理，権力大・関心小＝満足を保つ，権力小・関心大＝情報を提供，権力小・関心小＝監視。"},
{"id":"o-seam","orig":1,"cat":"stake","q":"ステークホルダー・エンゲージメント評価マトリックスで，ある部長の現在の関与度が“抵抗”，望ましい関与度が“支援”であった。PMの対応として最も適切なものはどれか。","ch":["影響を避けるため，その部長への情報提供を最小限にする。","抵抗の理由を把握し，懸念に対応するコミュニケーションを計画して関与度を高める。","望ましい関与度を“抵抗”に修正する。","スポンサに依頼して，その部長をステークホルダから外してもらう。"],"a":1,"ex":"現在（C）と望ましい（D）のギャップを埋めるのがエンゲージメント計画。R7午後Ⅰ問2（支持していないステークホルダ）とも直結する論点。"},
{"id":"o-transfer","orig":1,"cat":"risk","q":"マイナスのリスクへの対応戦略のうち，“転嫁”に該当するものはどれか。","ch":["納期遅延による損失に備えて保険に加入する。","テスト工程を追加して，障害の発生確率を下げる。","リスクの高い新技術の採用をやめ，実績のある技術を使う。","リスクが顕在化したら対処することとし，予備費を確保しておく。"],"a":0,"ex":"転嫁＝リスクの影響と責任を第三者に移す（保険，請負契約など）。ウは回避，イは軽減，エは受容（能動的）。"},
{"id":"o-exploit","orig":1,"cat":"risk","q":"プラスのリスク（好機）への対応戦略で，好機を確実に実現させるために不確実性を取り除く戦略はどれか。","ch":["活用","強化","共有","受容"],"a":0,"ex":"活用（Exploit）＝確実に実現させる，共有（Share）＝能力のある第三者と組む，強化（Enhance）＝発生確率や影響を高める。"},
{"id":"o-trigger","orig":1,"cat":"risk","q":"リスクマネジメントにおける“トリガー”の説明として，適切なものはどれか。","ch":["リスク対応策を実施した後に残るリスク","リスクが顕在化しつつあることを示す兆候や事象","リスク対応策を実施したことによって新たに発生するリスク","リスクの影響を受ける成果物の一覧"],"a":1,"ex":"トリガー＝兆候（警告サイン）。アは残存リスク，ウは二次リスク。H28午後Ⅱ問2「リスクの兆候への対応」はこの論点の論述版。"},
{"id":"o-monte","orig":1,"cat":"risk","q":"モンテカルロ・シミュレーションをスケジュール分析に用いる目的として，適切なものはどれか。","ch":["クリティカルパス上の作業に資源を追加する。","各作業の所要期間のばらつきを考慮し，プロジェクト完了日の確率分布を求める。","作業の依存関係を図示する。","各作業の担当者を決定する。"],"a":1,"ex":"乱数で多数回シミュレーションし「〇日以内に終わる確率は△％」を求める。定量的リスク分析の代表的手法。"},
{"id":"o-po","orig":1,"cat":"dev","q":"スクラムにおいて，プロダクトバックログの項目の並び順（優先順位）に責任をもつのは誰か。","ch":["開発者","ステークホルダー","プロダクトオーナー","スクラムマスター"],"a":2,"ex":"PO＝価値の最大化とバックログ管理。SM＝スクラムの理解と実践を支援するサーバントリーダー。開発者＝スプリントバックログとインクリメントを作る。"},
{"id":"o-retro","orig":1,"cat":"dev","q":"スクラムのスプリントレトロスペクティブの目的として，適切なものはどれか。","ch":["前日の作業を共有し，当日の計画を立てる。","完成したインクリメントをステークホルダーにデモし，フィードバックを得る。","品質と効果を高める方法を計画するため，人・相互作用・プロセス・ツールなどについて検査する。","次のスプリントで取り組むバックログ項目を選択する。"],"a":2,"ex":"レトロ＝ふりかえり（チーム自身のやり方の改善）。イはスプリントレビュー，エはスプリントプランニング，アはデイリースクラム。"},
{"id":"o-manifesto","orig":1,"cat":"dev","q":"アジャイルソフトウェア開発宣言で，価値を置くとされているものの組合せとして適切なものはどれか（左記のことがらにより価値を置く）。","ch":["変化への対応よりも計画に従うこと","顧客との協調よりも契約交渉","包括的なドキュメントよりも動くソフトウェア","個人と対話よりもプロセスやツール"],"a":2,"ex":"4つの価値：個人と対話＞プロセスやツール，動くソフトウェア＞包括的なドキュメント，顧客との協調＞契約交渉，変化への対応＞計画に従うこと。"},
{"id":"o-mvp","orig":1,"cat":"dev","q":"MVP（Minimum Viable Product）の説明として，適切なものはどれか。","ch":["社内向けの技術検証用プロトタイプで，顧客には提供しないもの","顧客に価値を提供でき，仮説を検証して学びを得られる最小限の機能をもつプロダクト","全ての要求を満たした最終製品","最小限のコストで作られた低品質な製品"],"a":1,"ex":"MVPは「学習のための最小の製品」。早く市場に出してフィードバックを得る（リーンスタートアップ）。"},
{"id":"o-devops","orig":1,"cat":"dev","q":"DevOpsの説明として，最も適切なものはどれか。","ch":["ウォータフォールモデルで，運用テストを開発工程に先行して行う取組み","開発チームと運用チームが協調し，自動化などによってソフトウェアのリリースを迅速かつ継続的に行う取組み","システム運用の手順書を開発工程の最初に作成する取組み","開発と運用を別会社に委託して，責任分界を明確にする取組み"],"a":1,"ex":"CI/CD，インフラのコード化などでデプロイまでの時間を短縮。R4午後Ⅰ問2の解答例にも「デプロイまでの時間を短縮する効果」。"},
{"id":"o-ukeoi","orig":1,"cat":"law","q":"システム開発における請負契約の特徴として，適切なものはどれか。","ch":["発注者は受注者の要員に対して直接指揮命令できる。","受注者は仕事の完成義務を負わず，善良な管理者の注意をもって事務処理を行う義務を負う。","受注者は仕事の完成義務を負い，成果物が契約内容に適合しない場合は契約不適合責任を負う。","報酬は作業時間に応じて支払われ，成果物の完成は条件とならない。"],"a":2,"ex":"請負＝完成責任＋契約不適合責任。準委任＝善管注意義務（履行割合型・成果完成型がある）。発注者が直接指揮命令できるのは派遣だけ。"},
{"id":"o-gisou","orig":1,"cat":"law","q":"請負契約で受託した作業において，“偽装請負”とみなされるおそれが最も高い状況はどれか。","ch":["受注者の責任者が，自社の作業者に作業指示を出している。","発注者と受注者の責任者同士で，仕様について打合せをしている。","受注者の作業者が，発注者の事業所内で作業している。","発注者の社員が，受注者の作業者に直接作業の指示を出し，勤怠も管理している。"],"a":3,"ex":"請負では発注者は受注者の作業者に指揮命令できない。直接指示・勤怠管理をすると実態は派遣（偽装請負）となる。発注者側の事業所での作業自体は違法ではない。"},
{"id":"o-copyright","orig":1,"cat":"law","q":"請負契約で外部企業に開発を委託したプログラムの著作権について，契約に特段の定めがない場合の帰属として，適切なものはどれか。","ch":["開発した受託者（受注企業）に帰属する。","著作権は発生しない。","委託者と受託者の共有となる。","代金を支払った委託者（発注企業）に帰属する。"],"a":0,"ex":"著作権は創作した者に発生する。発注者が権利を得るには，契約で譲渡（著作権法27条・28条の権利を含めて明記）を定める必要がある。"},
{"id":"o-shitauke","orig":1,"cat":"law","q":"下請法（下請代金支払遅延等防止法）における下請代金の支払期日に関する定めとして，適切なものはどれか。","ch":["親事業者が検査を完了した日から起算して90日以内で定める。","親事業者が顧客から代金を受領した後に支払えばよい。","支払期日は当事者間の合意で自由に定めることができる。","給付を受領した日から起算して60日以内のできる限り短い期間内で定める。"],"a":3,"ex":"受領日から60日以内。検査の有無にかかわらず受領日起算。発注者からの入金を条件にすることもできない。"},
{"id":"o-haken","orig":1,"cat":"law","q":"労働者派遣において，派遣先が行ってはならない行為はどれか。","ch":["派遣労働者に対して，業務の指揮命令を行う。","派遣労働者を受け入れる前に，事前面接を行って特定の人を選ぶ。","派遣労働者に対して，職場の安全衛生に関する教育を行う。","派遣先責任者を選任する。"],"a":1,"ex":"派遣先による派遣労働者の特定（事前面接，履歴書の送付要求など）は禁止（紹介予定派遣を除く）。指揮命令は派遣先が行う。"},
{"id":"o-pi","orig":1,"cat":"law","q":"個人情報保護法における“要配慮個人情報”の取得について，適切なものはどれか。","ch":["法令に基づく場合などを除き，あらかじめ本人の同意を得なければならない。","匿名加工しなければ取得できない。","利用目的を公表していれば，本人の同意なく取得できる。","オプトアウトの手続を取れば，本人の同意なく第三者に提供できる。"],"a":0,"ex":"病歴・犯罪歴・信条などの要配慮個人情報は，取得に原則本人同意が必要で，オプトアウトによる第三者提供も禁止されている。"},
{"id":"o-sla","orig":1,"cat":"svc","q":"SLA（サービスレベル合意書）の説明として，適切なものはどれか。","ch":["サービス提供者と顧客との間で，提供するサービスの内容と目標水準を合意した文書","サービス提供者の内部部門間で，サポート内容を合意した文書","サービス提供者が外部供給者と結ぶ契約","サービスの障害対応手順を記した文書"],"a":0,"ex":"SLA＝提供者と顧客。OLA（運用レベル合意書）＝提供者の内部部門間。UC＝外部供給者との契約（裏付け契約）。"},
{"id":"o-sqli","orig":1,"cat":"sec","q":"SQLインジェクション攻撃への根本的な対策として，最も適切なものはどれか。","ch":["SQL文の組立てにプレースホルダ（バインド機構）を使用する。","パスワードを定期的に変更する。","Webサーバとブラウザ間の通信をTLSで暗号化する。","ファイアウォールで外部からの通信を全て遮断する。"],"a":0,"ex":"入力値をSQLの構文として解釈させないプレースホルダが根本対策。TLSは盗聴対策でありSQLインジェクションには無効。"},
{"id":"o-mfa","orig":1,"cat":"sec","q":"多要素認証に該当するものはどれか。","ch":["パスワードを入力した後，秘密の質問の答えを入力する。","パスワードを長く複雑にする。","2種類のパスワードを続けて入力する。","パスワードを入力した後，スマートフォンに届いたワンタイムコードを入力する。"],"a":3,"ex":"多要素＝知識（パスワード），所持（スマホ，ICカード），生体（指紋）のうち異なる要素を組み合わせる。ア・ウはどちらも知識要素だけ（多段階だが多要素ではない）。"},
{"id":"o-zt","orig":1,"cat":"sec","q":"ゼロトラストの考え方として，適切なものはどれか。","ch":["クラウドサービスの利用を禁止し，オンプレミスで運用する。","社内ネットワークかどうかにかかわらず，全てのアクセスを信頼せず，都度検証する。","社内ネットワークは安全とみなし，境界のファイアウォールで外部からの侵入を防ぐ。","利用者の認証は初回ログイン時の一度だけ行う。"],"a":1,"ex":"「決して信頼せず，常に検証せよ」。クラウド・リモートワーク前提で，境界防御だけに頼らない。ウは従来の境界型防御。"},
{"id":"o-ransom","orig":1,"cat":"sec","q":"ランサムウェアによる被害に備えたバックアップの運用として，最も適切なものはどれか。","ch":["バックアップを業務サーバと同じネットワーク共有フォルダに常時保管する。","バックアップデータの復元テストは行わない。","バックアップは最新の1世代だけを保持する。","バックアップの一部を，ネットワークから切り離した媒体や変更不可能な領域に保管する。"],"a":3,"ex":"オンラインのバックアップは一緒に暗号化される恐れがある。オフライン・イミュータブル保管，複数世代，定期的な復元テストが基本。"},
{"id":"o-ux","orig":1,"cat":"svc","q":"UX（顧客体験価値）を重視したシステム開発プロジェクトで，PMが計画に盛り込む活動として最も適切なものはどれか。","ch":["要件定義で全ての画面仕様を確定し，以降は変更を受け付けない。","開発者の判断だけで画面のデザインを決定する。","UXの評価は本番稼働後に行い，開発中は機能要件の実現だけに集中する。","利用者のニーズを複数回にわたり収集し，設計やテストの各段階で利用者参加の検証を繰り返す。"],"a":3,"ex":"R3以降，午後Ⅰで4年連続出題されたテーマ。R6午後Ⅰ問1の出題趣旨も「ニーズを多面的に複数回収集し，各段階で適合性を繰り返し検証する」。"},
{"id":"o-genai","orig":1,"cat":"dev","q":"生成AIを業務システムに組み込むプロジェクトで，ハルシネーション（もっともらしい誤り）のリスクへの対応として，最も適切なものはどれか。","ch":["プロンプトを長くすれば誤りは発生しないので，対策は不要である。","生成AIの出力は常に正しいものとして，そのまま利用者に提示する。","出力の正確性を評価する基準とテストデータを用意し，人による確認プロセスも設計する。","テストは不要とし，本番稼働後の問合せで誤りを把握する。"],"a":2,"ex":"生成AIの出力は確率的で誤りを含みうる。評価基準・評価データ・人間によるレビュー（Human in the Loop）を計画に組み込む。R7午後Ⅰ問1の題材。"},
{"id":"o-cf","orig":1,"cat":"dev","q":"共通フレーム（SLCP-JCF）の考え方において，システムの要件定義の主体（責任をもつ者）として適切なものはどれか。","ch":["取得者（発注者・利用部門）","監査人","保守者","供給者（開発ベンダ）"],"a":0,"ex":"要件定義は取得者の責任。ベンダは支援できても，業務要件を決めるのは発注者側。R7午後Ⅰの解答例にも「責任部署が業務部門であると理解してもらう」。"}
];

function checkStreakDecay(){const t=today();if(!S.last)return;const d=dayDiff(S.last,t);if(d>1){if(S.shield>0&&d===2){S.shield--;S.last=new Date(Date.now()-864e5).toISOString().slice(0,10);toast("<i class=ms aria-hidden=true>&#xF0033;</i> ストリークシールドで連続記録を守りました！")}else{S.streak=0}save()}}

let AC,MG,NZ;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.attack.value=.002;comp.release.value=.12;MG=AC.createGain();MG.gain.value=.95;MG.connect(comp).connect(AC.destination);const len=AC.sampleRate*.6|0,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;NZ=b}if(AC.state==="suspended")AC.resume();return AC}
function osc(f,dur,st=0,type="sine",v=.2,f2){const a=ac(),t=a.currentTime+st,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MG);o.start(t);o.stop(t+dur+.02)}
function noise(dur,st=0,v=.2,hp=2000,lp=12000){const a=ac(),t=a.currentTime+st,s=a.createBufferSource(),g=a.createGain(),h=a.createBiquadFilter(),l=a.createBiquadFilter();s.buffer=NZ;h.type="highpass";h.frequency.value=hp;l.type="lowpass";l.frequency.value=lp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(h).connect(l).connect(g).connect(MG);s.start(t);s.stop(t+dur+.02)}

/* ===== 疑似ハプティクス =====
 Android：Vibration API ／ iPhone（iOS 18以降のSafari）：非表示のスイッチ型チェックボックスを切り替えたときに鳴る端末の触覚を利用 */
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const CANVIB=typeof navigator.vibrate==="function"&&!IOS;
const EMBED=(()=>{try{return window.top!==window.self}catch(e){return true}})();
// iOS 18+ Safari：switch型チェックボックスのラベルをクリックすると端末の触覚が鳴る（毎回新しく作って head に入れ、display:none にする方式）
function iosTick(){try{const l=document.createElement("label");l.ariaHidden="true";l.style.display="none";const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");l.appendChild(i);document.head.appendChild(l);l.click();document.head.removeChild(l)}catch(e){}}
const HP={light:8,select:6,medium:16,heavy:28,success:[12,50,22],error:[28,40,28],combo:[10,30,10,30,24],big:[24,40,24,40,60]};
let lastHap=0;
function buzz(p){if(S.noHaptic)return;try{if(CANVIB){navigator.vibrate(p)}else if(IOS){const now=performance.now();if(now-lastHap<35)return;lastHap=now;iosTick();const n=Array.isArray(p)?Math.ceil(p.length/2):1;for(let k=1;k<n;k++)setTimeout(iosTick,k*90)}}catch(e){}}
const haptic=k=>buzz(HP[k]||HP.light);
function hapticFor(el){if(el.matches(".btn.ng,.chestbtn,.chest,.ov.chesting,#askY,#hpTest"))return"heavy";if(el.matches(".btn,.qa,.node,.li"))return"medium";if(el.matches(".ch"))return"select";return"light"}
const HSEL="button,a.btn,.li,.node,.qa,.chip,label.check,summary,select,.ov.chesting";
// Android：押した瞬間（pointerdown）。iPhone：タップ確定（click）＝ユーザー操作の中で必ず呼ぶ
document.addEventListener("pointerdown",e=>{if(!CANVIB)return;const el=e.target.closest(HSEL);if(el&&!el.disabled)haptic(hapticFor(el))},{passive:true,capture:true});
document.addEventListener("click",e=>{if(!IOS||!e.isTrusted||HOV)return;const el=e.target.closest(HSEL);if(el&&!el.disabled)haptic(hapticFor(el))},{capture:true});
/* iOS 26.5以降対策：指が触れた瞬間、ボタンの上に透明な本物のスイッチ（label＋switch）を重ね、
   指で実際にスイッチを切り替えさせて端末の触覚を鳴らす。切り替え後、元のボタンへクリックを転送する */
const HOV_SKIP="input,textarea,select,label.check,.wa,a[href]:not(.btn)";
let HOV=null,HOVt=null,HOVxy=null;
function hovHide(){if(HOV){HOV.style.display="none"}HOVt=null}
if(IOS){
 HOV=document.createElement("label");HOV.className="hov";HOV.setAttribute("aria-hidden","true");HOV.innerHTML='<input type="checkbox" switch tabindex="-1">';
 document.addEventListener("DOMContentLoaded",()=>document.body.appendChild(HOV));if(document.body)document.body.appendChild(HOV);
 const inp=HOV.querySelector("input");
 inp.addEventListener("click",e=>{e.stopPropagation();const t=HOVt;hovHide();if(t&&t.isConnected&&!t.disabled)setTimeout(()=>t.click(),0)});
 HOV.addEventListener("click",e=>{if(e.target===HOV)e.stopPropagation()});
 document.addEventListener("touchstart",e=>{if(S.noHaptic||e.touches.length>1){hovHide();return}const el=e.target.closest(HSEL);if(!el||el.disabled||el.matches(HOV_SKIP)||el.closest(".hov")){hovHide();return}
  const r=el.getBoundingClientRect(),t=e.touches[0];HOVt=el;HOVxy=[t.clientX,t.clientY];Object.assign(HOV.style,{display:"block",left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"})},{passive:true,capture:true});
 document.addEventListener("touchmove",e=>{if(!HOVt||!HOVxy)return;const t=e.touches[0];if(Math.hypot(t.clientX-HOVxy[0],t.clientY-HOVxy[1])>10)hovHide()},{passive:true,capture:true});
 document.addEventListener("touchcancel",hovHide,{capture:true});
 addEventListener("scroll",hovHide,{passive:true,capture:true});
}

/* ================= エフェクト（ヒットマーク・振動・フラッシュ・紙吹雪） ================= */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function sizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}sizeCv();addEventListener("resize",sizeCv);
const COLS=["#5b4cf5","#21c16b","#ffb21e","#ff4d8d","#1cb0f6","#ff7a1a","#ce82ff"];
function confetti(n=140,y=.35){if(RM)n=Math.min(n,30);for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.3,y:innerHeight*y,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,g:.32,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COLS[i%COLS.length],life:150+Math.random()*60,sh:Math.random()<.3?"c":"r"});run()}
function burst(x,y,c="#21c16b",n=14){for(let i=0;i<n;i++){const a=Math.PI*2*i/n,s=3+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.12,w:5,h:5,r:0,vr:0,c,life:34,sh:"c"})}run()}
// ヒットマーク：衝撃波リング＋火花。暗い縁取りで明るい背景でも見える。短く消す
function hitmark(x,y,c,pw=1){parts.push({t:"ring",x,y,rad:10,vr:7*pw,life:15,max:15,c,lw:5*pw});const n=8;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.35,s=(6+Math.random()*4)*pw;parts.push({t:"spark",x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,a,len:(16+Math.random()*8)*pw,life:13,max:13,c})}parts.push({t:"star",x,y,s:26*pw,life:10,max:10,c:"#fff"});run()}
function drawP(p){const k=p.life/p.max;
 if(p.t==="ring"){p.rad+=p.vr;p.vr*=.82;cx.globalAlpha=k;cx.lineWidth=p.lw+3;cx.strokeStyle="rgba(20,18,40,.35)";cx.beginPath();cx.arc(p.x,p.y,p.rad,0,7);cx.stroke();cx.lineWidth=p.lw;cx.strokeStyle=p.c;cx.stroke();return}
 if(p.t==="spark"){p.x+=p.vx;p.y+=p.vy;p.vx*=.8;p.vy*=.8;p.len*=.88;const ex=p.x+Math.cos(p.a)*p.len,ey=p.y+Math.sin(p.a)*p.len;cx.globalAlpha=Math.min(1,k*1.5);cx.lineCap="round";cx.lineWidth=7;cx.strokeStyle="rgba(20,18,40,.35)";cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(ex,ey);cx.stroke();cx.lineWidth=4;cx.strokeStyle=p.c;cx.stroke();return}
 if(p.t==="star"){const s=p.s*(1.3-k*.3);cx.globalAlpha=k;cx.save();cx.translate(p.x,p.y);cx.rotate((1-k)*.6);cx.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.32:s,a=i*Math.PI/4;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fillStyle=p.c;cx.strokeStyle="rgba(20,18,40,.3)";cx.lineWidth=2;cx.fill();cx.stroke();cx.restore();return}
 p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.sh==="c"){cx.beginPath();cx.arc(0,0,p.w/2,0,7);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
function run(){if(raf)return;const step=()=>{cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+40);for(const p of parts){cx.save();drawP(p);cx.restore()}if(parts.length)raf=requestAnimationFrame(step);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight)}};raf=requestAnimationFrame(step)}
// 振動：最初に強く→収束、少しランダム。大中小で揺れ方のパターン自体を変える
function jolt(el,amp,ms,mode="xy"){if(!el||!el.animate||RM)return;const n=Math.max(4,Math.round(ms/28)),kf=[];for(let i=0;i<=n;i++){const a=amp*Math.pow(1-i/n,1.4),sx=i%2?1:-1;kf.push({transform:`translate(${mode!=="y"?sx*a*(.6+Math.random()*.4):0}px,${mode!=="x"?(Math.random()*2-1)*a:0}px)`})}kf.push({transform:"none"});el.animate(kf,{duration:ms,easing:"linear"})}

function addXP(n){const before=levelOf(S.xp);S.xp+=n;const t=today();S.days[t]=(S.days[t]||0)+n;
 if(S.last!==t){if(S.last&&dayDiff(S.last,t)===1)S.streak++;else S.streak=1;S.last=t;S.best=Math.max(S.best,S.streak);S._streakUp=Date.now();if(S.streak%7===0&&S.shield<2){S.shield++;setTimeout(()=>toast("<i class=ms aria-hidden=true>&#xF0033;</i> 7日連続ボーナス：ストリークシールド獲得！"),1200)}}
 save();renderTop();qprog("xp",n);const after=levelOf(S.xp);if(after>before)setTimeout(()=>levelUp(after),L?1900:700);checkBadges()}
function levelUp(lv){SFX.lv();flash("#ffb21e");shakeScreen("l");confetti(200);buzz([30,40,30,40,60]);modal(`<div class="rays"><div class="big lvpop">${E("military_medal")}</div></div><h2 style="margin:10px 0 4px">レベル ${lv+1} に到達！</h2><p>称号：<b>${titleOf(lv)}</b></p><p class="muted">次のレベルまで ${lvXP(lv+1)-S.xp} XP</p><button class="btn gold" onclick="closeModal()">やったね！</button>`)}
/* ===== デイリークエスト（目的を目の前に吊るす） ===== */
const QPOOL=[{k:"ok",n:"10問正解する",g:10,i:"check_circle"},{k:"c5",n:"5連続正解を出す",g:1,i:"local_fire_department"},{k:"ls",n:"レッスンを2回クリア",g:2,i:"star"},{k:"pf",n:"パーフェクトを1回",g:1,i:"crown"},{k:"pm1",n:"記述問題に1問挑戦",g:1,i:"edit_note"},{k:"xp",n:"80XP獲得する",g:80,i:"diamond"},{k:"qk",n:"10秒以内の正解を5回",g:5,i:"bolt"},{k:"wk",n:"苦手復習をクリア",g:1,i:"psychology"}];
function dq(){const t=today();if(!S.dq||S.dq.d!==t){let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;const pool=[...QPOOL],pick=[];for(let i=0;i<3;i++){h=(Math.imul(h,1103515245)+12345)>>>0;pick.push(pool.splice(h%pool.length,1)[0].k)}S.dq={d:t,ks:pick,p:{},done:{},bonus:false};save()}return S.dq}
function qprog(k,n=1){const d=dq();if(!d.ks.includes(k)||d.done[k])return;const q=QPOOL.find(x=>x.k===k);d.p[k]=Math.min(q.g,(d.p[k]||0)+n);save();
 if(d.p[k]>=q.g){d.done[k]=true;save();setTimeout(()=>{SFX.quest();haptic("success");toast(`<i class=ms aria-hidden=true>&#xF0037;</i> クエスト達成「${q.n}」 +20XP`);addXP(20);if(d.ks.every(x=>d.done[x])&&!d.bonus){d.bonus=true;save();setTimeout(()=>openChest("デイリークエスト全達成！",2),1500)}},L?400:200)}}
function questHTML(){const d=dq();const all=d.ks.every(x=>d.done[x]);return `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3 style="margin:0"><i class=ms aria-hidden=true>&#xF0037;</i> 今日のクエスト</h3><span class="muted">${all?"全達成！<i class=ms aria-hidden=true>&#xF002F;</i>":"全達成で宝箱"}</span></div>${d.ks.map(k=>{const q=QPOOL.find(x=>x.k===k),p=d.p[k]||0,dn=d.done[k];return `<div class="qrow ${dn?"dn":""}"><span class="qi">${dn?"<i class=ms aria-hidden=true>&#xF0011;</i>":I(q.i)}</span><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${q.n}</div><div class="gauge"><i style="width:${p/q.g*100}%;background:${dn?"var(--ok)":"var(--gold)"}"></i></div></div><span class="muted" style="font-weight:700">${p}/${q.g}</span></div>`}).join("")}</div>`}

function qstat(id){return S.q[id]||(S.q[id]={c:0,w:0,box:0,due:0})}
function record(id,ok){const s=qstat(id);s.seen=Date.now();s.n=(s.n||0)+1;if(ok){s.c++;s.box=Math.min(5,s.box+1)}else{s.w++;s.box=0}s.due=Date.now()+[0,1,3,7,14,30][s.box]*864e5*(ok?1:0)+(ok?0:6e4);S.totalAns++;if(ok)S.totalOk++;save()}
function weakIds(){return Q.filter(q=>{const s=S.q[q.id];return s&&s.w>0&&(s.box<3||s.due<=Date.now())}).sort((a,b)=>(S.q[a.id].box-S.q[b.id].box)||(S.q[b.id].w-S.q[a.id].w)).map(q=>q.id)}
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
// まだ解いていない問題→しばらく見ていない問題の順に選ぶ（同点はランダム）
function fresh(ids,n){const now=Date.now();return shuf(ids).map(id=>{const st=S.q[id]||{};return[id,(st.n?1:0)*1e13+(st.seen||0)+Math.random()*36e5]}).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function dueIds(){return Q.filter(q=>{const s=S.q[q.id];return s&&s.due&&s.due<=Date.now()}).map(q=>q.id)}
